# The social-message bridge stack — Matrix as the aggregation bus, exactly the
# Beeper trick, run entirely on this Mac. See bridges/README.md for the why and
# the setup dance; SOCIAL-BRIDGES-PLAN.md for how it fits the track.
#
# THREE containers, ONE exposed port:
#   synapse            — the homeserver (the bus). The ONLY service with a host
#                        port, bound to 127.0.0.1 so nothing off this machine
#                        can reach it. Federation is off (see homeserver.yaml).
#   mautrix-meta       — Facebook Messenger. Split from Instagram in mautrix
#                        v26.07 when Meta dropped IG's shared API, so it is now
#                        Messenger-only.
#   mautrix-instagram  — Instagram DMs. Same repo, the `ig-` image tag.
#
# The bridges have NO host ports: they talk to synapse over the internal compose
# network (http://synapse:8008), and synapse reaches each bridge's appservice
# endpoint over that same network. Nothing here federates and nothing here
# listens on a routable interface — this is inbound fetch of the owner's own
# DMs, the same posture as the IMAP and Oura pollers.
#
# Data lives OUTSIDE the repo, under ~/.hazlie/matrix/* (0700), because it holds
# session cookies and message content. Only this compose file and the templated
# configs are committed.

name: hazlie-bridges

services:
  synapse:
    image: ghcr.io/element-hq/synapse:v1.140.0
    container_name: hazlie-synapse
    restart: unless-stopped
    # 127.0.0.1 ONLY — the homeserver is reachable from this Mac (Element to log
    # in the bridges, and the hazlie `matrix` connector to sync), never the LAN.
    ports:
      - "127.0.0.1:8008:8008"
    volumes:
      - ${HAZLIE_MATRIX}/synapse:/data
      # Each bridge's registration.yaml, mounted read-only from that bridge's own
      # data dir so synapse always sees the CURRENT tokens (no stale copies).
      # homeserver.yaml lists these paths under app_service_config_files.
      - ${HAZLIE_MATRIX}/meta/registration.yaml:/registrations/meta.yaml:ro
      - ${HAZLIE_MATRIX}/instagram/registration.yaml:/registrations/instagram.yaml:ro
      - ${HAZLIE_MATRIX}/twitter/registration.yaml:/registrations/twitter.yaml:ro
      - ${HAZLIE_MATRIX}/telegram/registration.yaml:/registrations/telegram.yaml:ro
      - ${HAZLIE_MATRIX}/discord/registration.yaml:/registrations/discord.yaml:ro
      - ${HAZLIE_MATRIX}/slack/registration.yaml:/registrations/slack.yaml:ro
    environment:
      - SYNAPSE_CONFIG_DIR=/data
      - SYNAPSE_CONFIG_PATH=/data/homeserver.yaml
    networks:
      - bus

  mautrix-meta:
    image: dock.mau.dev/mautrix/meta:v26.08
    container_name: hazlie-meta
    restart: unless-stopped
    depends_on:
      - synapse
    volumes:
      - ${HAZLIE_MATRIX}/meta:/data
    networks:
      - bus

  mautrix-instagram:
    image: dock.mau.dev/mautrix/meta:ig-v26.08
    container_name: hazlie-instagram
    restart: unless-stopped
    depends_on:
      - synapse
    volumes:
      - ${HAZLIE_MATRIX}/instagram:/data
    networks:
      - bus

  # X / Twitter DMs. Its own repo (mautrix/twitter), same megabridge family
  # and the same posture as the Meta pair: no host port, cookie login driven
  # from the connect page, owner-gated (Austin said go, 2026-08-22 — this was
  # the "accept the account risk" item in SOCIAL-BRIDGES-PLAN.md).
  mautrix-twitter:
    image: dock.mau.dev/mautrix/twitter:v26.08
    container_name: hazlie-twitter
    restart: unless-stopped
    depends_on:
      - synapse
    volumes:
      - ${HAZLIE_MATRIX}/twitter:/data
    networks:
      - bus

  # Telegram, Discord, Slack — same bus, same posture (no host port, cookie/
  # token login from the connect page, presence off, no backfill). Owner
  # asked for all three, 2026-08-22. Telegram additionally needs an
  # api_id/api_hash from my.telegram.org/apps in
  # ~/.hazlie/matrix/telegram/config.yaml before its login works — the
  # container runs without it, the login just can't start until it's set.
  mautrix-telegram:
    image: dock.mau.dev/mautrix/telegram:latest
    container_name: hazlie-telegram
    restart: unless-stopped
    depends_on:
      - synapse
    volumes:
      - ${HAZLIE_MATRIX}/telegram:/data
    networks:
      - bus

  mautrix-discord:
    image: dock.mau.dev/mautrix/discord:latest
    container_name: hazlie-discord
    restart: unless-stopped
    depends_on:
      - synapse
    volumes:
      - ${HAZLIE_MATRIX}/discord:/data
    networks:
      - bus

  mautrix-slack:
    image: dock.mau.dev/mautrix/slack:latest
    container_name: hazlie-slack
    restart: unless-stopped
    depends_on:
      - synapse
    volumes:
      - ${HAZLIE_MATRIX}/slack:/data
    networks:
      - bus

# Login is driven NATIVELY from Hazlie's own connect page (connect/lib/bridge.mjs
# + bridgePage.mjs), which talks to the bridge bots over the local Matrix API —
# so there is no third-party Matrix client in the stack. An earlier build ran an
# Element web container here as a scaffold; it was removed once the connect-page
# flow worked.

networks:
  bus:
    name: hazlie-bus
