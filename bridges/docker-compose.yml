# The social-message bridge stack — Matrix as the aggregation bus, exactly the
# Beeper trick, run entirely on this Mac. See bridges/README.md for the why and
# the setup dance; SOCIAL-BRIDGES-PLAN.md for how it fits the track.
#
# THREE containers, ONE exposed port:
#   synapse            — the homeserver (the bus). The ONLY service with a host
#                        port, bound to 127.0.0.1 so nothing off this machine
#                        can reach it. Federation is off (see homeserver.yaml).
#   mautrix-meta       — Facebook Messenger. Split from Instagram in mautrix
#                        v26.07 when Meta dropped IG's shared API, so it is now
#                        Messenger-only.
#   mautrix-instagram  — Instagram DMs. Same repo, the `ig-` image tag.
#
# The bridges have NO host ports: they talk to synapse over the internal compose
# network (http://synapse:8008), and synapse reaches each bridge's appservice
# endpoint over that same network. Nothing here federates and nothing here
# listens on a routable interface — this is inbound fetch of the owner's own
# DMs, the same posture as the IMAP and Oura pollers.
#
# Data lives OUTSIDE the repo, under ~/.hazlie/matrix/* (0700), because it holds
# session cookies and message content. Only this compose file and the templated
# configs are committed. HAZLIE_MATRIX (bridges/.env, gitignored) names that
# tree, and every volume below uses compose's `:?` required form: unset, the
# variable would otherwise substitute as an empty string and the stack would
# silently mount its data at filesystem root instead of failing.

name: hazlie-bridges

services:
  synapse:
    # v1.140.0, pinned to the manifest published and locally exercised for 0.2.
    image: ghcr.io/element-hq/synapse@sha256:2af5409da4e155123ef1f8ab30914fb14ba36b8b909197073498db733298fcd7
    container_name: hazlie-synapse
    restart: unless-stopped
    # 127.0.0.1 ONLY — the homeserver is reachable from this Mac (Element to log
    # in the bridges, and the hazlie `matrix` connector to sync), never the LAN.
    ports:
      - "127.0.0.1:8008:8008"
    volumes:
      - ${HAZLIE_MATRIX:?set HAZLIE_MATRIX in bridges/.env to ~/.hazlie/matrix}/synapse:/data
      # Each bridge's registration.yaml, mounted read-only from that bridge's own
      # data dir so synapse always sees the CURRENT tokens (no stale copies).
      # homeserver.yaml lists these paths under app_service_config_files.
      - ${HAZLIE_MATRIX:?set HAZLIE_MATRIX in bridges/.env to ~/.hazlie/matrix}/meta/registration.yaml:/registrations/meta.yaml:ro
      - ${HAZLIE_MATRIX:?set HAZLIE_MATRIX in bridges/.env to ~/.hazlie/matrix}/instagram/registration.yaml:/registrations/instagram.yaml:ro
      - ${HAZLIE_MATRIX:?set HAZLIE_MATRIX in bridges/.env to ~/.hazlie/matrix}/twitter/registration.yaml:/registrations/twitter.yaml:ro
      - ${HAZLIE_MATRIX:?set HAZLIE_MATRIX in bridges/.env to ~/.hazlie/matrix}/telegram/registration.yaml:/registrations/telegram.yaml:ro
      - ${HAZLIE_MATRIX:?set HAZLIE_MATRIX in bridges/.env to ~/.hazlie/matrix}/discord/registration.yaml:/registrations/discord.yaml:ro
      - ${HAZLIE_MATRIX:?set HAZLIE_MATRIX in bridges/.env to ~/.hazlie/matrix}/slack/registration.yaml:/registrations/slack.yaml:ro
      - ${HAZLIE_MATRIX:?set HAZLIE_MATRIX in bridges/.env to ~/.hazlie/matrix}/linkedin/registration.yaml:/registrations/linkedin.yaml:ro
    environment:
      - SYNAPSE_CONFIG_DIR=/data
      - SYNAPSE_CONFIG_PATH=/data/homeserver.yaml
    networks:
      - bus

  mautrix-meta:
    # v26.08, immutable multi-architecture manifest.
    image: dock.mau.dev/mautrix/meta@sha256:662f3d52249304c44c91cbc3d3552eced3e5baf93916be7c6b17a47677036de8
    container_name: hazlie-meta
    restart: unless-stopped
    depends_on:
      - synapse
    volumes:
      - ${HAZLIE_MATRIX:?set HAZLIE_MATRIX in bridges/.env to ~/.hazlie/matrix}/meta:/data
    networks:
      - bus

  mautrix-instagram:
    # ig-v26.08, immutable multi-architecture manifest.
    image: dock.mau.dev/mautrix/meta@sha256:4b2704de94809351884da2640b1b1421920980a60269aa871fa870a8d50e7eb0
    container_name: hazlie-instagram
    restart: unless-stopped
    depends_on:
      - synapse
    volumes:
      - ${HAZLIE_MATRIX:?set HAZLIE_MATRIX in bridges/.env to ~/.hazlie/matrix}/instagram:/data
    networks:
      - bus

  # X / Twitter DMs. Its own repo (mautrix/twitter), same megabridge family
  # and the same posture as the Meta pair: no host port, cookie login driven
  # from the connect page, owner-gated (owner decision, 2026-08-22 — this was
  # the "accept the account risk" item in SOCIAL-BRIDGES-PLAN.md).
  mautrix-twitter:
    # Pinned BY DIGEST to a 2026-08-25 dev build, not to :latest — the header
    # rule against mutable tags stands, and a digest is the only immutable name
    # a dev build has. Moved off the v26.08 release because that build could
    # not complete an X login: registering the XChat public key returned HTTP
    # 403 behind a Cloudflare challenge, every time, with correct cookies
    # (owner, 2026-08-25). The previous pin is one line down if this regresses.
    # ~~image: dock.mau.dev/mautrix/twitter:v26.08~~
    image: dock.mau.dev/mautrix/twitter@sha256:a780515de3c7fa8f410e2d6355d4c69a0c439742c40bafeec8a3d8e61a94cbc4
    container_name: hazlie-twitter
    restart: unless-stopped
    depends_on:
      - synapse
    volumes:
      - ${HAZLIE_MATRIX:?set HAZLIE_MATRIX in bridges/.env to ~/.hazlie/matrix}/twitter:/data
    networks:
      - bus

  # Telegram, Discord, Slack — same bus, same posture (no host port, cookie/
  # token login from the connect page, double puppeting off, history backfill
  # ON).
  #
  # This line read "presence off, no backfill" until 2026-08-22. Both halves
  # were wrong and are corrected rather than deleted, because a stale posture
  # comment is worse than none — it gets quoted as authority. Backfill was
  # reversed by owner decision the same day ("all connections should pull bulk
  # messages"); a bridge that starts empty is a memory that starts empty.
  # `presence` is not a key these images keep at all — they drop it on the
  # config rewrite they do at startup, so it was a no-op being copied around.
  # What actually holds the line is double_puppet.secrets being empty, which is
  # the only mechanism by which a bridge could act as the owner. The enforced
  # version of this paragraph is checkBridgeHardening() in
  # connectors/lib/checks.mjs: it FAILS when backfill is off and WARNs when
  # double puppeting is on, across every config in ${HAZLIE_MATRIX}. Trust that
  # over this comment.
  #
  # Owner
  # asked for all three, 2026-08-22. Telegram additionally needs an
  # api_id/api_hash from my.telegram.org/apps in
  # ~/.hazlie/matrix/telegram/config.yaml before its login works — the
  # container runs without it, the login just can't start until it's set.
  mautrix-telegram:
    # Locally exercised 0.2 image, pinned before the mutable latest tag moved.
    image: dock.mau.dev/mautrix/telegram@sha256:c073961f95aafca58392affcb57ea74364a2d17f018a36d29a208828db8a11e8
    container_name: hazlie-telegram
    restart: unless-stopped
    depends_on:
      - synapse
    volumes:
      - ${HAZLIE_MATRIX:?set HAZLIE_MATRIX in bridges/.env to ~/.hazlie/matrix}/telegram:/data
    networks:
      - bus

  mautrix-discord:
    # Locally exercised 0.2 image, immutable multi-architecture manifest.
    image: dock.mau.dev/mautrix/discord@sha256:065405ca2f961b2687ca577c4eb65592c139d641342a9611d98b5394f30cf84a
    container_name: hazlie-discord
    restart: unless-stopped
    depends_on:
      - synapse
    volumes:
      - ${HAZLIE_MATRIX:?set HAZLIE_MATRIX in bridges/.env to ~/.hazlie/matrix}/discord:/data
    networks:
      - bus

  # LinkedIn. Added 2026-08-25 (owner, twice): LinkedIn was the one social
  # source that arrived as a one-time CSV export the owner had to request,
  # download and unzip by hand — a dead end next to six platforms that just
  # log in. It rides the same bus with the same posture, and its rows land
  # under the SAME `linkedin` source the export used, so every people-graph
  # join that already reads LinkedIn keeps working unchanged.
  mautrix-linkedin:
    # Locally exercised 0.2 image, immutable multi-architecture manifest.
    image: dock.mau.dev/mautrix/linkedin@sha256:0bf683337f3a2e27f01b057f0ff83b8ec488676da400c944773dbbd936c15778
    container_name: hazlie-linkedin
    restart: unless-stopped
    depends_on:
      - synapse
    volumes:
      - ${HAZLIE_MATRIX:?set HAZLIE_MATRIX in bridges/.env to ~/.hazlie/matrix}/linkedin:/data
    networks:
      - bus

  mautrix-slack:
    # Locally cached 0.2 image, pinned before the mutable latest tag moved.
    image: dock.mau.dev/mautrix/slack@sha256:77610eaaaa368829bcc3b78b8c79bb981832803a903991a48c6b9d2d70ff243d
    container_name: hazlie-slack
    restart: unless-stopped
    depends_on:
      - synapse
    volumes:
      - ${HAZLIE_MATRIX:?set HAZLIE_MATRIX in bridges/.env to ~/.hazlie/matrix}/slack:/data
    networks:
      - bus

# Login is driven NATIVELY from Intaglio Labs' own connect page (connect/lib/bridge.mjs
# + bridgePage.mjs), which talks to the bridge bots over the local Matrix API —
# so there is no third-party Matrix client in the stack. An earlier build ran an
# Element web container here as a scaffold; it was removed once the connect-page
# flow worked.

networks:
  bus:
    name: hazlie-bus
