<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review desk — dev</title>
<style>
  :root {
    --ground:#f4f5f7; --surface:#fff; --surface-2:#eceef2;
    --line:#d3d7e0; --fg:#191d26; --fg-2:#4d5566; --fg-3:#79808f;
    --accent:#a86a1c;
    --bad:#a3352f; --bad-soft:#f8e5e3;
    --weak:#8a6d1f; --weak-soft:#f7eeda;
    --ok:#1f6b63; --ok-soft:#dcefec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground:#14171d; --surface:#1b1f27; --surface-2:#232833;
      --line:#2f3542; --fg:#e6e9ef; --fg-2:#a8b0bf; --fg-3:#7a8293;
      --accent:#d9a24e;
      --bad:#e08079; --bad-soft:#35211f;
      --weak:#d9b85e; --weak-soft:#332c1a;
      --ok:#5fb8ac; --ok-soft:#16302d;
    }
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--ground); color:var(--fg);
    font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  header {
    position:sticky; top:0; z-index:5; background:var(--surface);
    border-bottom:1px solid var(--line); padding:.85rem 1.25rem;
    display:flex; gap:1rem; align-items:center; flex-wrap:wrap;
  }
  h1 { font-size:.95rem; margin:0; font-weight:600; letter-spacing:-.01em; }
  .dev {
    font-size:.62rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
    background:var(--bad-soft); color:var(--bad); padding:.2rem .45rem; border-radius:3px;
  }
  .counts { margin-left:auto; display:flex; gap:1rem; font-size:.8rem; color:var(--fg-3); }
  .counts b { color:var(--fg); font-variant-numeric:tabular-nums; }
  .filters { display:flex; gap:.35rem; flex-wrap:wrap; }
  button {
    font:inherit; font-size:.78rem; padding:.3rem .6rem; border-radius:4px;
    border:1px solid var(--line); background:var(--surface-2); color:var(--fg-2);
    cursor:pointer;
  }
  button[aria-pressed="true"] { background:var(--fg); color:var(--surface); border-color:var(--fg); }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  main { max-width:56rem; margin:0 auto; padding:1.25rem; display:flex; flex-direction:column; gap:.7rem; }
  .claim {
    background:var(--surface); border:1px solid var(--line); border-radius:5px;
    padding:.9rem 1rem; display:grid; gap:.55rem;
  }
  .claim[data-band="unsupported"] { border-left:3px solid var(--bad); }
  .claim[data-band="weak"]        { border-left:3px solid var(--weak); }
  .claim[data-band="supported"]   { border-left:3px solid var(--ok); }
  .claim.gone { opacity:.35; }
  .text { font-size:1.02rem; line-height:1.45; }
  .meta { display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; font-size:.74rem; color:var(--fg-3); }
  .tag {
    font-size:.64rem; font-weight:600; letter-spacing:.07em; text-transform:uppercase;
    padding:.16rem .4rem; border-radius:3px; background:var(--surface-2); color:var(--fg-2);
  }
  .tag.unsupported { background:var(--bad-soft); color:var(--bad); }
  .tag.weak        { background:var(--weak-soft); color:var(--weak); }
  .tag.supported   { background:var(--ok-soft); color:var(--ok); }
  .evidence {
    font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:.8rem;
    background:var(--surface-2); border:1px solid var(--line); border-radius:4px;
    padding:.5rem .65rem; color:var(--fg-2); white-space:pre-wrap; word-break:break-word;
  }
  .evidence .q { color:var(--fg); background:color-mix(in srgb, var(--accent) 22%, transparent); border-radius:2px; }
  .acts { display:flex; gap:.4rem; }
  .acts button { padding:.32rem .8rem; }
  .acts .keep:hover  { border-color:var(--ok);  color:var(--ok); }
  .acts .drop:hover  { border-color:var(--bad); color:var(--bad); }
  .empty, .err { color:var(--fg-3); padding:2rem 0; text-align:center; }
  .err { color:var(--bad); }
  kbd {
    font:inherit; font-size:.7rem; background:var(--surface-2);
    border:1px solid var(--line); border-radius:3px; padding:0 .3rem;
  }
  .tabs { display:flex; gap:.3rem; }
  .tabs button {
    font-weight:600;
  }
  .tabs button[aria-pressed="true"] { background:var(--fg); color:var(--surface); border-color:var(--fg); }
  .health { font-size:.74rem; color:var(--fg-3); }
  .poolbar { display:flex; gap:.4rem; margin:.5rem 0; }
  table.pool { border-collapse:collapse; width:100%; font-size:.85rem; }
  table.pool th, table.pool td { text-align:left; padding:.35rem .5rem; border-bottom:1px solid var(--line, #333); }
  table.pool td.n { text-align:right; font-variant-numeric:tabular-nums; }
  .health b { color:var(--fg); font-variant-numeric:tabular-nums; }
  .health.stale { color:var(--weak); }
  .card5 {
    background:var(--surface); border:1px solid var(--line); border-radius:5px;
    padding:.9rem 1rem; display:grid; gap:.55rem;
  }
  .card5.gone { opacity:.35; }
  .c-trigger {
    font-size:.68rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--accent);
  }
  .c-who { font-size:.95rem; font-weight:600; }
  .c-who .dim { font-weight:400; color:var(--fg-2); }
  .c-tie { font-size:.92rem; line-height:1.45; color:var(--fg-2); }
  .c-quote {
    font-style:italic; font-size:.85rem; color:var(--fg-2);
    border-left:2px solid var(--line); padding:.2rem 0 .2rem .6rem;
  }
  .c-judged {
    font-size:.72rem; color:var(--fg-3); display:flex; gap:.4rem; flex-wrap:wrap;
  }
  .c-judged .tag {
    font-size:.64rem; font-weight:600; letter-spacing:.05em; text-transform:uppercase;
    padding:.14rem .38rem; border-radius:3px; background:var(--surface-2); color:var(--fg-2);
  }
  .c-also { font-size:.72rem; color:var(--fg-3); font-style:italic; }
  .batch-head {
    display:flex; gap:.7rem; align-items:baseline; margin:1.1rem 0 .3rem;
    font-size:.72rem; color:var(--fg-3); text-transform:uppercase; letter-spacing:.05em;
  }
  .batch-head:first-child { margin-top:0; }
  .batch-head b { color:var(--fg-2); font-variant-numeric:tabular-nums; }
  .c-acts { display:flex; gap:.4rem; flex-wrap:wrap; }
  .c-acts button { padding:.32rem .8rem; }
  .c-acts .fine:hover        { border-color:var(--ok);   color:var(--ok); }
  .c-acts .not-useful:hover,
  .c-acts .wrong-person:hover,
  .c-acts .never-this-person:hover { border-color:var(--bad); color:var(--bad); }
</style>
</head>
<body>

<header>
  <h1>Review desk</h1>
  <span class="dev">dev only</span>
  <div class="tabs" id="tabs"></div>
  <div class="filters" id="filters"></div>
  <div class="counts" id="counts"></div>
  <div class="health" id="health"></div>
</header>

<main id="claimsView">
  <div id="list"></div>
  <p class="empty" id="hint">
    <kbd>a</kbd> keep · <kbd>x</kbd> drop · <kbd>j</kbd>/<kbd>k</kbd> move
  </p>
</main>

<main id="cardsView" hidden>
  <div id="cardsList"></div>
</main>

<main id="poolView" hidden>
  <div class="poolbar" id="poolbar"></div>
  <p class="health" id="poolNote"></p>
  <div id="poolList"></div>
</main>

<script>
const BANDS = ['unsupported', 'weak', 'supported', 'all'];
let band = 'unsupported';   // the interesting one first: no content word shared with its source
let claims = [];
let cursor = 0;

const el = (t, c, txt) => { const n = document.createElement(t); if (c) n.className = c; if (txt !== undefined) n.textContent = txt; return n; };

// ---- tabs: claims (existing) / cards (new) --------------------------------
const VIEWS = ['claims', 'cards', 'pool'];
let view = 'cards';
let cardsLoaded = false;

function renderTabs() {
  const box = document.getElementById('tabs');
  box.replaceChildren(...VIEWS.map((v) => {
    const btn = el('button', null, v[0].toUpperCase() + v.slice(1));
    btn.setAttribute('aria-pressed', String(v === view));
    btn.addEventListener('click', () => selectView(v));
    return btn;
  }));
}

function selectView(v) {
  view = v;
  renderTabs();
  document.getElementById('claimsView').hidden = v !== 'claims';
  document.getElementById('cardsView').hidden = v !== 'cards';
  document.getElementById('poolView').hidden = v !== 'pool';
  document.getElementById('filters').hidden = v !== 'claims';
  document.getElementById('counts').hidden = v !== 'claims';
  document.getElementById('health').hidden = v !== 'cards';
  if (v === 'cards' && !cardsLoaded) { cardsLoaded = true; loadCards(); loadHealth(); }
  if (v === 'pool') { renderPoolBar(); loadPool(); }
}

// ---- pool: the producer's ranked eligible set, per mode -------------------
const MODES = ['investor', 'founder', 'any'];
let poolMode = 'investor';
function renderPoolBar() {
  const box = document.getElementById('poolbar');
  box.replaceChildren(...MODES.map((m) => {
    const btn = el('button', null, m);
    btn.setAttribute('aria-pressed', String(m === poolMode));
    btn.addEventListener('click', () => { poolMode = m; renderPoolBar(); loadPool(); });
    return btn;
  }));
}
async function loadPool() {
  const list = document.getElementById('poolList');
  const note = document.getElementById('poolNote');
  list.replaceChildren(el('p', 'health', 'loading…'));
  try {
    const res = await fetch('/api/pool?mode=' + encodeURIComponent(poolMode));
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    const rows = data.rows ?? [];
    note.textContent = poolMode + ' · ' + rows.length + ' eligible · ranked by depth, then change, then quiet. Eligible = two-way or met, quiet ≥180d on the DM clock, nothing scheduled, they wrote to you at least once, not muted/suppressed/never.';
    const table = el('table', 'pool');
    const head = el('tr');
    for (const h of ['#', 'name', 'tags', 'role', 'depth', 'msgs', 'met', 'quiet d', 'they wrote last']) head.appendChild(el('th', null, h));
    table.appendChild(head);
    rows.forEach((r, i) => {
      const tr = el('tr');
      tr.appendChild(el('td', 'n', String(i + 1)));
      tr.appendChild(el('td', null, r.name ?? r.personKey));
      tr.appendChild(el('td', null, (r.subRoles ?? []).join(', ')));
      tr.appendChild(el('td', null, r.role ?? ''));
      tr.appendChild(el('td', 'n', String(r.depth ?? '')));
      tr.appendChild(el('td', 'n', String(r.messages ?? '')));
      tr.appendChild(el('td', 'n', String(r.meetings ?? '')));
      tr.appendChild(el('td', 'n', String(r.quietDays ?? '')));
      tr.appendChild(el('td', null, r.theyWroteLast ? 'yes' : ''));
      table.appendChild(tr);
    });
    list.replaceChildren(table);
  } catch (err) {
    list.replaceChildren(el('p', 'err', 'could not load: ' + err.message));
  }
}

function renderFilters() {
  const box = document.getElementById('filters');
  box.replaceChildren(...BANDS.map((b) => {
    const btn = el('button', null, b);
    btn.setAttribute('aria-pressed', String(b === band));
    btn.addEventListener('click', () => { band = b; cursor = 0; render(); });
    return btn;
  }));
}

// The quote is a verbatim span of the row. Highlight it in place rather than
// showing it separately, so it is obvious whether the span actually carries the
// claim or is a fragment that happens to be real.
function evidence(row) {
  const box = el('div', 'evidence');
  const text = row.source_text ?? '';
  const q = row.quote ?? '';
  const at = q && text ? text.indexOf(q) : -1;
  if (at === -1) {
    box.append(text || '(source row unavailable)');
    if (q) { box.append('\n\nquote: '); const s = el('span', 'q', q); box.append(s); }
    return box;
  }
  box.append(text.slice(0, at));
  box.append(el('span', 'q', q));
  box.append(text.slice(at + q.length));
  return box;
}

function card(row, i) {
  const node = el('div', 'claim');
  node.dataset.band = row.support_band ?? 'unscorable';
  node.dataset.id = String(row.id);
  if (i === cursor) node.style.outline = '2px solid var(--accent)';

  node.append(el('div', 'text', row.text));

  const meta = el('div', 'meta');
  meta.append(el('span', 'tag ' + (row.support_band ?? ''), row.support_band ?? 'unscorable'));
  meta.append(el('span', 'tag', row.kind));
  const s = row.support ?? {};
  meta.append(el('span', null,
    `${s.inRow ?? 0}/${s.words ?? 0} words in source · p=${row.p_claim ?? '—'} · ${row.source ?? ''}`));
  node.append(meta);

  node.append(evidence(row));

  const acts = el('div', 'acts');
  const keep = el('button', 'keep', 'Keep');
  const drop = el('button', 'drop', 'Drop');
  keep.addEventListener('click', () => decide(row, 'accept', node));
  drop.addEventListener('click', () => decide(row, 'reject', node));
  acts.append(keep, drop);
  node.append(acts);
  return node;
}

function visible() {
  return band === 'all' ? claims : claims.filter((c) => (c.support_band ?? 'unscorable') === band);
}

function render() {
  renderFilters();
  const list = document.getElementById('list');
  const rows = visible();
  if (rows.length === 0) {
    list.replaceChildren(el('p', 'empty', 'Nothing left in this band.'));
    return;
  }
  cursor = Math.max(0, Math.min(cursor, rows.length - 1));
  list.replaceChildren(...rows.map(card));
  const active = list.children[cursor];
  if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest' });
}

async function decide(row, action, node) {
  node.classList.add('gone');
  try {
    const res = await fetch('/api/decide', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      // The reason is what makes a decision auditable six months on. "reviewed
      // in the dev desk" is honest about where it came from.
      body: JSON.stringify({ claim_id: row.id, action, reason: 'reviewed in the dev review desk' }),
    });
    if (!res.ok) throw new Error(await res.text());
    claims = claims.filter((c) => c.id !== row.id);
    render();
    counts();
  } catch (err) {
    node.classList.remove('gone');
    document.getElementById('hint').textContent = 'could not save: ' + err.message;
  }
}

function counts() {
  const by = {};
  for (const c of claims) by[c.support_band ?? 'unscorable'] = (by[c.support_band ?? 'unscorable'] ?? 0) + 1;
  document.getElementById('counts').replaceChildren(
    ...Object.entries(by).map(([k, v]) => {
      const s = el('span', null, k + ' ');
      s.append(el('b', null, String(v)));
      return s;
    })
  );
}

document.addEventListener('keydown', (e) => {
  if (view !== 'claims') return;
  const rows = visible();
  if (rows.length === 0) return;
  if (e.key === 'j') { cursor = Math.min(cursor + 1, rows.length - 1); render(); }
  if (e.key === 'k') { cursor = Math.max(cursor - 1, 0); render(); }
  if (e.key === 'a' || e.key === 'x') {
    const row = rows[cursor];
    const node = document.getElementById('list').children[cursor];
    if (row && node) decide(row, e.key === 'a' ? 'accept' : 'reject', node);
  }
});

// ---- Cards view -------------------------------------------------------
// Data: EVERY rm_candidate_batch and all its rm_candidate_snapshot rows,
// served read-only by /api/cards (quote and name already resolved server
// side), grouped by batch, newest first. Verdicts go through
// /api/cards/event, which forwards to hermes's /admin/relationship/event
// using the bearer token -- this page never talks to hermes directly.
let cardBatches = [];

function cardTrigger(ev) {
  const focus = ev.focus ? `NEED · focus: ${ev.focus}` : 'NEED';
  return `${focus} · quiet ${ev.dormancyDays ?? '—'}d · met ${ev.meetings ?? '—'}× · ${ev.messages ?? '—'} msgs`;
}

function eventTag(e) {
  const label = e.reason ? `${e.event}: ${e.reason}` : e.event;
  return el('span', 'tag', label);
}

function cardNode(row) {
  const node = el('div', 'card5');
  node.dataset.id = String(row.id);
  const ev = row.evidence ?? {};

  node.append(el('div', 'c-trigger', cardTrigger(ev)));

  const who = el('div', 'c-who');
  who.append(document.createTextNode(row.name));
  const bits = [ev.role, ev.label].filter(Boolean);
  if (bits.length) {
    who.append(document.createTextNode(' '));
    who.append(el('span', 'dim', '· ' + bits.join(' · ')));
  }
  node.append(who);

  node.append(el('div', 'c-tie', row.summary));
  node.append(el('blockquote', 'c-quote', row.quote));

  if (row.events && row.events.length) {
    const judged = el('div', 'c-judged');
    judged.append(...row.events.map(eventTag));
    node.append(judged);
  }

  // Same person_key showing up in another pass -- visible so a repeat isn't
  // mistaken for a fresh read, without hiding the row (each snapshot is its
  // own immutable offer and gets its own verdict).
  if (row.also_in_batches && row.also_in_batches.length) {
    const label = row.also_in_batches.length === 1
      ? `also in batch ${row.also_in_batches[0]}`
      : `also in batches ${row.also_in_batches.join(', ')}`;
    node.append(el('div', 'c-also', label));
  }

  const acts = el('div', 'c-acts');
  const verdicts = [
    { cls: 'fine', label: 'Fine', event: 'accepted', note: 'baseline: fine' },
    { cls: 'not-useful', label: 'Not useful', event: 'dismissed', reason: 'not-useful', note: 'baseline' },
    { cls: 'wrong-person', label: 'Wrong person', event: 'dismissed', reason: 'wrong-person', note: 'baseline' },
    { cls: 'never-this-person', label: 'Never this person', event: 'dismissed', reason: 'never-this-person', note: 'baseline' },
  ];
  for (const v of verdicts) {
    const btn = el('button', v.cls, v.label);
    btn.addEventListener('click', () => cardVerdict(row, v, node));
    acts.append(btn);
  }
  node.append(acts);

  return node;
}

function batchHead(batch) {
  const head = el('div', 'batch-head');
  head.append(el('span', null, 'batch '), el('b', null, String(batch.id)));
  head.append(el('span', null, new Date(batch.created_at).toLocaleString()));
  head.append(el('span', null, `${batch.candidate_count} candidate${batch.candidate_count === 1 ? '' : 's'}`));
  return head;
}

function renderCards() {
  const list = document.getElementById('cardsList');
  const total = cardBatches.reduce((n, b) => n + b.cards.length, 0);
  if (total === 0) {
    list.replaceChildren(el('p', 'empty', 'No candidate snapshots in any batch.'));
    return;
  }
  const nodes = [];
  for (const batch of cardBatches) {
    nodes.push(batchHead(batch));
    if (batch.cards.length === 0) { nodes.push(el('p', 'empty', 'no candidates in this batch')); continue; }
    nodes.push(...batch.cards.map(cardNode));
  }
  list.replaceChildren(...nodes);
}

async function cardVerdict(row, v, node) {
  node.classList.add('gone');
  try {
    const res = await fetch('/api/cards/event', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        snapshot_id: row.id, person_key: row.person_key, event: v.event,
        ...(v.reason ? { reason: v.reason } : {}), note: v.note,
      }),
    });
    if (!res.ok) throw new Error(await res.text());
    row.events = [...(row.events ?? []), { event: v.event, reason: v.reason ?? null, created_at: Date.now() }];
    node.classList.remove('gone');
    node.replaceWith(cardNode(row));
  } catch (err) {
    node.classList.remove('gone');
    document.getElementById('cardsList').append(el('p', 'err', 'could not save: ' + err.message));
  }
}

async function loadCards() {
  try {
    const res = await fetch('/api/cards');
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    cardBatches = data.batches ?? [];
    renderCards();
  } catch (err) {
    document.getElementById('cardsList').replaceChildren(el('p', 'err', 'could not load: ' + err.message));
  }
}

async function loadHealth() {
  const box = document.getElementById('health');
  try {
    const res = await fetch('/api/health');
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    const p = data.peopleProjection;
    if (!p) { box.textContent = ''; return; }
    box.classList.toggle('stale', Boolean(p.rebuilding));
    box.replaceChildren();
    const rev = el('span', null, 'rev '); rev.append(el('b', null, String(p.projectedRevision ?? '—')));
    const cnt = el('span', null, 'people '); cnt.append(el('b', null, String(p.peopleCount ?? '—')));
    box.append(rev, cnt);
    if (p.rebuilding) box.append(el('span', null, 'rebuilding'));
  } catch {
    box.textContent = '';
  }
}

renderTabs();
selectView('cards');

(async function load() {
  try {
    const res = await fetch('/api/pending?limit=500');
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    claims = data.claims ?? [];
    counts();
    render();
  } catch (err) {
    document.getElementById('list').replaceChildren(el('p', 'err', 'could not load: ' + err.message));
  }
}());
</script>
</body>
</html>
