<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review desk — dev</title>
<style>
  :root {
    --ground:#f4f5f7; --surface:#fff; --surface-2:#eceef2;
    --line:#d3d7e0; --fg:#191d26; --fg-2:#4d5566; --fg-3:#79808f;
    --accent:#a86a1c;
    --bad:#a3352f; --bad-soft:#f8e5e3;
    --weak:#8a6d1f; --weak-soft:#f7eeda;
    --ok:#1f6b63; --ok-soft:#dcefec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground:#14171d; --surface:#1b1f27; --surface-2:#232833;
      --line:#2f3542; --fg:#e6e9ef; --fg-2:#a8b0bf; --fg-3:#7a8293;
      --accent:#d9a24e;
      --bad:#e08079; --bad-soft:#35211f;
      --weak:#d9b85e; --weak-soft:#332c1a;
      --ok:#5fb8ac; --ok-soft:#16302d;
    }
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--ground); color:var(--fg);
    font:15px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  header {
    position:sticky; top:0; z-index:5; background:var(--surface);
    border-bottom:1px solid var(--line); padding:.85rem 1.25rem;
    display:flex; gap:1rem; align-items:center; flex-wrap:wrap;
  }
  h1 { font-size:.95rem; margin:0; font-weight:600; letter-spacing:-.01em; }
  .dev {
    font-size:.62rem; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
    background:var(--bad-soft); color:var(--bad); padding:.2rem .45rem; border-radius:3px;
  }
  .counts { margin-left:auto; display:flex; gap:1rem; font-size:.8rem; color:var(--fg-3); }
  .counts b { color:var(--fg); font-variant-numeric:tabular-nums; }
  .filters { display:flex; gap:.35rem; flex-wrap:wrap; }
  button {
    font:inherit; font-size:.78rem; padding:.3rem .6rem; border-radius:4px;
    border:1px solid var(--line); background:var(--surface-2); color:var(--fg-2);
    cursor:pointer;
  }
  button[aria-pressed="true"] { background:var(--fg); color:var(--surface); border-color:var(--fg); }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  main { max-width:56rem; margin:0 auto; padding:1.25rem; display:flex; flex-direction:column; gap:.7rem; }
  /* display:flex on main/filters beat the UA's [hidden]{display:none}; every tab was visible at once. */
  [hidden] { display:none !important; }
  .claim {
    background:var(--surface); border:1px solid var(--line); border-radius:5px;
    padding:.9rem 1rem; display:grid; gap:.55rem;
  }
  .claim[data-band="unsupported"] { border-left:3px solid var(--bad); }
  .claim[data-band="weak"]        { border-left:3px solid var(--weak); }
  .claim[data-band="supported"]   { border-left:3px solid var(--ok); }
  .claim.gone { opacity:.35; }
  .text { font-size:1.02rem; line-height:1.45; }
  .meta { display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; font-size:.74rem; color:var(--fg-3); }
  .tag {
    font-size:.64rem; font-weight:600; letter-spacing:.07em; text-transform:uppercase;
    padding:.16rem .4rem; border-radius:3px; background:var(--surface-2); color:var(--fg-2);
  }
  .tag.unsupported { background:var(--bad-soft); color:var(--bad); }
  .tag.weak        { background:var(--weak-soft); color:var(--weak); }
  .tag.supported   { background:var(--ok-soft); color:var(--ok); }
  .evidence {
    font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:.8rem;
    background:var(--surface-2); border:1px solid var(--line); border-radius:4px;
    padding:.5rem .65rem; color:var(--fg-2); white-space:pre-wrap; word-break:break-word;
  }
  .evidence .q { color:var(--fg); background:color-mix(in srgb, var(--accent) 22%, transparent); border-radius:2px; }
  .acts { display:flex; gap:.4rem; }
  .acts button { padding:.32rem .8rem; }
  .acts .keep:hover  { border-color:var(--ok);  color:var(--ok); }
  .acts .drop:hover  { border-color:var(--bad); color:var(--bad); }
  .empty, .err { color:var(--fg-3); padding:2rem 0; text-align:center; }
  .err { color:var(--bad); }
  kbd {
    font:inherit; font-size:.7rem; background:var(--surface-2);
    border:1px solid var(--line); border-radius:3px; padding:0 .3rem;
  }
  .tabs { display:flex; gap:.3rem; }
  .tabs button {
    font-weight:600;
  }
  .tabs button[aria-pressed="true"] { background:var(--fg); color:var(--surface); border-color:var(--fg); }
  .health { font-size:.74rem; color:var(--fg-3); }
  .poolbar { display:flex; gap:.4rem; align-items:center; margin:.5rem 0; flex-wrap:wrap; }
  .pool-offered { display:flex; align-items:center; gap:.3rem; font-size:.78rem; color:var(--fg-2); margin-left:.5rem; }
  table.pool { border-collapse:collapse; width:100%; font-size:.85rem; }
  table.pool th, table.pool td { text-align:left; padding:.35rem .5rem; border-bottom:1px solid var(--line, #333); }
  table.pool td.n { text-align:right; font-variant-numeric:tabular-nums; }
  table.pool tr.gone { opacity:.4; }
  .pool-acts { display:flex; gap:.3rem; flex-wrap:wrap; white-space:nowrap; align-items:center; }
  .pool-acts button { padding:.2rem .5rem; font-size:.72rem; }
  .pool-done { font-size:.78rem; color:var(--fg-3); font-style:italic; }
  .health b { color:var(--fg); font-variant-numeric:tabular-nums; }
  .health.stale { color:var(--weak); }
  .card5 {
    background:var(--surface); border:1px solid var(--line); border-radius:5px;
    padding:.9rem 1rem; display:grid; gap:.55rem;
  }
  .card5.gone { opacity:.35; }
  .c-trigger {
    font-size:.68rem; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--accent);
  }
  .c-who { font-size:.95rem; font-weight:600; }
  .c-who .dim { font-weight:400; color:var(--fg-2); }
  .c-tie { font-size:.92rem; line-height:1.45; color:var(--fg-2); }
  .c-quote {
    font-style:italic; font-size:.85rem; color:var(--fg-2);
    border-left:2px solid var(--line); padding:.2rem 0 .2rem .6rem;
  }
  .c-judged {
    font-size:.72rem; color:var(--fg-3); display:flex; gap:.4rem; flex-wrap:wrap;
  }
  .c-judged .tag {
    font-size:.64rem; font-weight:600; letter-spacing:.05em; text-transform:uppercase;
    padding:.14rem .38rem; border-radius:3px; background:var(--surface-2); color:var(--fg-2);
  }
  .c-also { font-size:.72rem; color:var(--fg-3); font-style:italic; }
  .c-changed { font-size:.78rem; color:var(--fg-2); display:flex; gap:.4rem; flex-wrap:wrap; }
  .c-changed a { color:var(--accent); }
  .c-changed.dim { color:var(--fg-3); font-style:italic; }
  .batch-head {
    display:flex; gap:.7rem; align-items:baseline; margin:1.1rem 0 .3rem;
    font-size:.72rem; color:var(--fg-3); text-transform:uppercase; letter-spacing:.05em;
  }
  .batch-head:first-child { margin-top:0; }
  .batch-head b { color:var(--fg-2); font-variant-numeric:tabular-nums; }
  .c-acts { display:flex; gap:.4rem; flex-wrap:wrap; }
  .c-acts button { padding:.32rem .8rem; }
  .c-acts .fine:hover        { border-color:var(--ok);   color:var(--ok); }
  .c-acts .not-useful:hover,
  .c-acts .wrong-person:hover,
  .c-acts .never-this-person:hover { border-color:var(--bad); color:var(--bad); }

  /* ---- Pages view: a pool list left, the selected person's page right ---- */
  .pages-wrap { display:grid; grid-template-columns:18rem 1fr; gap:1rem; align-items:start; max-width:none; }
  .pages-left { display:flex; flex-direction:column; gap:.5rem; }
  .pages-list {
    background:var(--surface); border:1px solid var(--line); border-radius:5px;
    max-height:70vh; overflow-y:auto;
  }
  .pages-row {
    display:flex; justify-content:space-between; gap:.4rem; align-items:center;
    padding:.5rem .7rem; border-bottom:1px solid var(--line); cursor:pointer; font-size:.85rem;
  }
  .pages-row:last-child { border-bottom:none; }
  .pages-row:hover { background:var(--surface-2); }
  .pages-row[aria-current="true"] { background:var(--surface-2); font-weight:600; }
  .pages-row .has-page {
    font-size:.62rem; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    color:var(--ok); background:var(--ok-soft); padding:.1rem .35rem; border-radius:3px;
  }
  .pages-right {
    background:var(--surface); border:1px solid var(--line); border-radius:5px;
    padding:1rem 1.1rem; display:flex; flex-direction:column; gap:.9rem; min-height:8rem;
  }
  .pages-right-head { display:flex; justify-content:space-between; align-items:center; gap:.6rem; flex-wrap:wrap; }
  .pages-right-head h2 { font-size:1rem; margin:0; }
  .pg-section { display:flex; flex-direction:column; gap:.5rem; }
  .pg-section-title {
    font-size:.68rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--fg-3);
  }
  .pg-item {
    border:1px solid var(--line); border-radius:5px; padding:.7rem .8rem; display:grid; gap:.5rem;
  }
  .pg-item-text { font-size:.95rem; line-height:1.4; }
  .pg-item .c-quote { margin:0; }
  .pg-item-acts { display:flex; gap:.4rem; align-items:center; }
  .pg-item-acts button { padding:.28rem .7rem; }
  .pg-item-acts .keep:hover { border-color:var(--ok); color:var(--ok); }
  .pg-item-acts .drop:hover { border-color:var(--bad); color:var(--bad); }
  .pg-decided {
    font-size:.72rem; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
  }
  .pg-decided.accept { color:var(--ok); }
  .pg-decided.reject { color:var(--bad); }
  .pages-built { font-size:.74rem; color:var(--fg-3); }
  .pages-right-head-buttons { display:flex; gap:.4rem; }
  .lookup-row {
    border:1px solid var(--line); border-radius:5px; padding:.6rem .7rem; display:grid; gap:.4rem;
  }
  .lookup-meta { font-size:.74rem; color:var(--fg-3); }
  .lookup-query {
    font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:.8rem;
    background:var(--surface-2); border:1px solid var(--line); border-radius:4px;
    padding:.4rem .55rem; color:var(--fg-2); white-space:pre-wrap; word-break:break-word;
  }

  /* ---- Lint view: step 5½'s findings, grouped by check ---- */
  .lint-check-head {
    display:flex; gap:.6rem; align-items:baseline; margin:1.1rem 0 .3rem;
    font-size:.72rem; color:var(--fg-3); text-transform:uppercase; letter-spacing:.05em;
  }
  .lint-check-head:first-child { margin-top:0; }
  .lint-check-head b { color:var(--fg-2); font-variant-numeric:tabular-nums; }
  .lint-row {
    border:1px solid var(--line); border-radius:5px; padding:.7rem .8rem; display:grid; gap:.5rem;
  }
  .lint-row.gone { opacity:.35; }
  .lint-who { font-size:.92rem; font-weight:600; }
  .lint-age { font-size:.72rem; color:var(--fg-3); }
  .lint-detail {
    font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:.78rem;
    background:var(--surface-2); border:1px solid var(--line); border-radius:4px;
    padding:.45rem .6rem; color:var(--fg-2); white-space:pre-wrap; word-break:break-word;
  }
  .lint-acts { display:flex; gap:.4rem; flex-wrap:wrap; }
  .lint-acts button { padding:.28rem .7rem; }
  .lint-acts .dismiss:hover { border-color:var(--bad); color:var(--bad); }
  .lint-acts .keep-export:hover,
  .lint-acts .keep-derived:hover,
  .lint-acts .both:hover { border-color:var(--ok); color:var(--ok); }
</style>
</head>
<body>

<header>
  <h1>Review desk</h1>
  <span class="dev">dev only</span>
  <div class="tabs" id="tabs"></div>
  <div class="filters" id="filters"></div>
  <div class="counts" id="counts"></div>
  <div class="health" id="health"></div>
</header>

<main id="claimsView">
  <div id="list"></div>
  <p class="empty" id="hint">
    <kbd>a</kbd> keep · <kbd>x</kbd> drop · <kbd>j</kbd>/<kbd>k</kbd> move
  </p>
</main>

<main id="cardsView" hidden>
  <p class="health" id="cardStatsLine"></p>
  <div id="cardsList"></div>
</main>

<main id="poolView" hidden>
  <div class="poolbar" id="poolbar"></div>
  <p class="health" id="poolNote"></p>
  <div id="poolList"></div>
</main>

<main id="pagesView" hidden>
  <div class="poolbar" id="pagesBar"></div>
  <p class="health" id="sweepStatus"></p>
  <p class="health" id="lookupStatus"></p>
  <div class="pages-wrap">
    <div class="pages-left">
      <div class="pages-list" id="pagesList"></div>
    </div>
    <div class="pages-right" id="pagesRight">
      <p class="empty">pick someone on the left</p>
    </div>
  </div>
</main>

<main id="lintView" hidden>
  <div class="poolbar" id="lintBar"></div>
  <p class="health" id="lintStatusLine"></p>
  <div id="lintList"></div>
</main>

<script>
const BANDS = ['unsupported', 'weak', 'supported', 'all'];
let band = 'unsupported';   // the interesting one first: no content word shared with its source
let claims = [];
let cursor = 0;

const el = (t, c, txt) => { const n = document.createElement(t); if (c) n.className = c; if (txt !== undefined) n.textContent = txt; return n; };

// ---- tabs: claims (existing) / cards (new) --------------------------------
const VIEWS = ['claims', 'cards', 'pool', 'pages', 'lint'];
let view = 'cards';
let cardsLoaded = false;

function renderTabs() {
  const box = document.getElementById('tabs');
  box.replaceChildren(...VIEWS.map((v) => {
    const btn = el('button', null, v[0].toUpperCase() + v.slice(1));
    btn.setAttribute('aria-pressed', String(v === view));
    btn.addEventListener('click', () => selectView(v));
    return btn;
  }));
}

function selectView(v) {
  view = v;
  renderTabs();
  document.getElementById('claimsView').hidden = v !== 'claims';
  document.getElementById('cardsView').hidden = v !== 'cards';
  document.getElementById('poolView').hidden = v !== 'pool';
  document.getElementById('pagesView').hidden = v !== 'pages';
  document.getElementById('lintView').hidden = v !== 'lint';
  document.getElementById('filters').hidden = v !== 'claims';
  document.getElementById('counts').hidden = v !== 'claims';
  document.getElementById('health').hidden = v !== 'cards';
  if (v === 'cards' && !cardsLoaded) { cardsLoaded = true; loadCards(); loadHealth(); }
  if (v === 'cards') loadCardStatsLine();
  if (v === 'pool') { renderPoolBar(); loadPool(); }
  if (v === 'pages') { renderPagesBar(); loadPagesList(); loadSweepStatus(); loadLookupStatus(); }
  if (v === 'lint') { renderLintBar(); loadLintStatus(); loadLintFindings(); }
}

// ---- pool: the producer's ranked eligible set, per mode -------------------
const MODES = ['investor', 'founder', 'any'];
let poolMode = 'investor';
let includeOffered = false;

// "fine" is a display-only verdict on the RANKING, not an event about a card
// (owner: the ranking did its job, there is nothing for hermes to record) --
// so it lives in localStorage, keyed per mode+person, and never touches the
// network.
const POOL_FINE_KEY = 'hzPoolFine';
function loadFineMarks() {
  try { return JSON.parse(localStorage.getItem(POOL_FINE_KEY) || '{}'); } catch { return {}; }
}
function markFine(personKey, mode) {
  try {
    const marks = loadFineMarks();
    marks[mode + '␀' + personKey] = { personKey, mode, at: Date.now() };
    localStorage.setItem(POOL_FINE_KEY, JSON.stringify(marks));
  } catch {}
}
function isFine(personKey, mode) {
  return Boolean(loadFineMarks()[mode + '␀' + personKey]);
}

function renderPoolBar() {
  const box = document.getElementById('poolbar');
  box.replaceChildren(...MODES.map((m) => {
    const btn = el('button', null, m);
    btn.setAttribute('aria-pressed', String(m === poolMode));
    btn.addEventListener('click', () => { poolMode = m; renderPoolBar(); loadPool(); });
    return btn;
  }));
  const label = el('label', 'pool-offered');
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.checked = includeOffered;
  cb.addEventListener('change', () => { includeOffered = cb.checked; loadPool(); });
  label.append(cb, document.createTextNode('show already-offered people'));
  box.appendChild(label);
}

// The pool route is gaining ?includeOffered=1; if the running hermes predates
// it, the request 400s -- fall back to the plain call rather than surfacing an
// error for a param this page knows to be optional.
async function fetchPool(mode, offered) {
  const qs = 'mode=' + encodeURIComponent(mode) + (offered ? '&includeOffered=1' : '');
  const res = await fetch('/api/pool?' + qs);
  if (res.ok) return res;
  if (offered && res.status === 400) return fetchPool(mode, false);
  throw new Error(await res.text());
}

// The one write path per action here -- forwarded verbatim to hermes's own
// route via serve.mjs, same shape as every other write on this page. Disables
// every button in the cell first, so a doubled click cannot fire twice.
async function poolPost(td, path, body) {
  for (const b of td.querySelectorAll('button')) b.disabled = true;
  try {
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(await res.text());
    return true;
  } catch (err) {
    for (const b of td.querySelectorAll('button')) b.disabled = false;
    td.appendChild(el('span', 'err', 'could not save: ' + err.message));
    return false;
  }
}

function poolActionsCell(r, tr) {
  const td = el('td', 'pool-acts');
  const setDone = (text) => {
    tr.classList.add('gone');
    td.replaceChildren(el('span', 'pool-done', text));
  };

  // Hidden in "any" mode: there is no per-mode tag on the row to remove.
  if (poolMode !== 'any') {
    const wrong = el('button', 'pool-wrong', 'wrong tag');
    wrong.addEventListener('click', async () => {
      const subRoles = (r.subRoles ?? []).filter((t) => t !== poolMode);
      if (await poolPost(td, '/api/pool/subroles', { personKey: r.personKey, subRoles })) {
        setDone('override saved');
      }
    });
    td.appendChild(wrong);
  }

  const never = el('button', 'pool-never', 'never');
  never.addEventListener('click', async () => {
    if (await poolPost(td, '/api/pool/never', {
      person_key: r.personKey, event: 'dismissed', reason: 'never-this-person',
      note: 'pool review', snapshot_id: null,
    })) {
      setDone('suppressed');
    }
  });
  td.appendChild(never);

  const alreadyFine = isFine(r.personKey, poolMode);
  const fine = el('button', 'pool-fine', alreadyFine ? '✓ fine' : 'fine');
  fine.disabled = alreadyFine;
  fine.addEventListener('click', () => {
    markFine(r.personKey, poolMode);
    fine.textContent = '✓ fine';
    fine.disabled = true;
  });
  td.appendChild(fine);

  return td;
}

async function loadPool() {
  const list = document.getElementById('poolList');
  const note = document.getElementById('poolNote');
  list.replaceChildren(el('p', 'health', 'loading…'));
  try {
    const res = await fetchPool(poolMode, includeOffered);
    const data = await res.json();
    const rows = data.rows ?? [];
    note.textContent = poolMode + ' · ' + rows.length + ' eligible · ranked by depth, then change, then quiet. Eligible = two-way or met, quiet ≥180d on the DM clock, nothing scheduled, they wrote to you at least once, not muted/suppressed/never.';
    const table = el('table', 'pool');
    const head = el('tr');
    for (const h of ['#', 'name', 'tags', 'role', 'depth', 'msgs', 'met', 'quiet d', 'they wrote last', 'actions']) head.appendChild(el('th', null, h));
    table.appendChild(head);
    rows.forEach((r, i) => {
      const tr = el('tr');
      tr.appendChild(el('td', 'n', String(i + 1)));
      tr.appendChild(el('td', null, r.name ?? r.personKey));
      tr.appendChild(el('td', null, (r.subRoles ?? []).join(', ')));
      tr.appendChild(el('td', null, r.role ?? ''));
      tr.appendChild(el('td', 'n', String(r.depth ?? '')));
      tr.appendChild(el('td', 'n', String(r.messages ?? '')));
      tr.appendChild(el('td', 'n', String(r.meetings ?? '')));
      tr.appendChild(el('td', 'n', String(r.quietDays ?? '')));
      tr.appendChild(el('td', null, r.theyWroteLast ? 'yes' : ''));
      tr.appendChild(poolActionsCell(r, tr));
      table.appendChild(tr);
    });
    list.replaceChildren(table);
  } catch (err) {
    list.replaceChildren(el('p', 'err', 'could not load: ' + err.message));
  }
}

function renderFilters() {
  const box = document.getElementById('filters');
  box.replaceChildren(...BANDS.map((b) => {
    const btn = el('button', null, b);
    btn.setAttribute('aria-pressed', String(b === band));
    btn.addEventListener('click', () => { band = b; cursor = 0; render(); });
    return btn;
  }));
}

// The quote is a verbatim span of the row. Highlight it in place rather than
// showing it separately, so it is obvious whether the span actually carries the
// claim or is a fragment that happens to be real.
function evidence(row) {
  const box = el('div', 'evidence');
  const text = row.source_text ?? '';
  const q = row.quote ?? '';
  const at = q && text ? text.indexOf(q) : -1;
  if (at === -1) {
    box.append(text || '(source row unavailable)');
    if (q) { box.append('\n\nquote: '); const s = el('span', 'q', q); box.append(s); }
    return box;
  }
  box.append(text.slice(0, at));
  box.append(el('span', 'q', q));
  box.append(text.slice(at + q.length));
  return box;
}

function card(row, i) {
  const node = el('div', 'claim');
  node.dataset.band = row.support_band ?? 'unscorable';
  node.dataset.id = String(row.id);
  if (i === cursor) node.style.outline = '2px solid var(--accent)';

  node.append(el('div', 'text', row.text));

  const meta = el('div', 'meta');
  meta.append(el('span', 'tag ' + (row.support_band ?? ''), row.support_band ?? 'unscorable'));
  meta.append(el('span', 'tag', row.kind));
  const s = row.support ?? {};
  meta.append(el('span', null,
    `${s.inRow ?? 0}/${s.words ?? 0} words in source · p=${row.p_claim ?? '—'} · ${row.source ?? ''}`));
  node.append(meta);

  node.append(evidence(row));

  // A discovery-sweep sub_role proposal: accepting this claim also unions the
  // tag into the person's sub_roles (applySweepDecision, server-side), which
  // changes who the reconnect producer offers -- worth saying before the
  // click, not after.
  if (row.sweep_kind === 'sub_role' && row.sweep_value) {
    node.append(el('div', 'health', `accepting also tags this person ${row.sweep_value}`));
  }

  const acts = el('div', 'acts');
  const keep = el('button', 'keep', 'Keep');
  const drop = el('button', 'drop', 'Drop');
  keep.addEventListener('click', () => decide(row, 'accept', node));
  drop.addEventListener('click', () => decide(row, 'reject', node));
  acts.append(keep, drop);
  node.append(acts);
  return node;
}

function visible() {
  return band === 'all' ? claims : claims.filter((c) => (c.support_band ?? 'unscorable') === band);
}

function render() {
  renderFilters();
  const list = document.getElementById('list');
  const rows = visible();
  if (rows.length === 0) {
    list.replaceChildren(el('p', 'empty', 'Nothing left in this band.'));
    return;
  }
  cursor = Math.max(0, Math.min(cursor, rows.length - 1));
  list.replaceChildren(...rows.map(card));
  const active = list.children[cursor];
  if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest' });
}

async function decide(row, action, node) {
  node.classList.add('gone');
  try {
    const res = await fetch('/api/decide', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      // The reason is what makes a decision auditable six months on. "reviewed
      // in the dev desk" is honest about where it came from.
      body: JSON.stringify({ claim_id: row.id, action, reason: 'reviewed in the dev review desk' }),
    });
    if (!res.ok) throw new Error(await res.text());
    claims = claims.filter((c) => c.id !== row.id);
    render();
    counts();
  } catch (err) {
    node.classList.remove('gone');
    document.getElementById('hint').textContent = 'could not save: ' + err.message;
  }
}

function counts() {
  const by = {};
  for (const c of claims) by[c.support_band ?? 'unscorable'] = (by[c.support_band ?? 'unscorable'] ?? 0) + 1;
  document.getElementById('counts').replaceChildren(
    ...Object.entries(by).map(([k, v]) => {
      const s = el('span', null, k + ' ');
      s.append(el('b', null, String(v)));
      return s;
    })
  );
}

document.addEventListener('keydown', (e) => {
  if (view !== 'claims') return;
  const rows = visible();
  if (rows.length === 0) return;
  if (e.key === 'j') { cursor = Math.min(cursor + 1, rows.length - 1); render(); }
  if (e.key === 'k') { cursor = Math.max(cursor - 1, 0); render(); }
  if (e.key === 'a' || e.key === 'x') {
    const row = rows[cursor];
    const node = document.getElementById('list').children[cursor];
    if (row && node) decide(row, e.key === 'a' ? 'accept' : 'reject', node);
  }
});

// ---- Cards view -------------------------------------------------------
// Data: EVERY rm_candidate_batch and all its rm_candidate_snapshot rows,
// served read-only by /api/cards (quote and name already resolved server
// side), grouped by batch, newest first. Verdicts go through
// /api/cards/event, which forwards to hermes's /admin/relationship/event
// using the bearer token -- this page never talks to hermes directly.
let cardBatches = [];

function cardTrigger(ev) {
  const focus = ev.focus ? `NEED · focus: ${ev.focus}` : 'NEED';
  return `${focus} · quiet ${ev.dormancyDays ?? '—'}d · met ${ev.meetings ?? '—'}× · ${ev.messages ?? '—'} msgs`;
}

function eventTag(e) {
  const label = e.reason ? `${e.event}: ${e.reason}` : e.event;
  return el('span', 'tag', label);
}

// judged is server-computed (dedup'd against accepted/dismissed rows) but
// falls back to a client-side check for rows built from an optimistic local
// update (cardVerdict appends to row.events without a round trip).
function isJudged(row) {
  if (row.judged) return true;
  return (row.events ?? []).some((e) => e.event === 'accepted' || e.event === 'dismissed');
}

function cardNode(row) {
  const node = el('div', 'card5');
  node.dataset.id = String(row.id);
  const ev = row.evidence ?? {};
  const judged = isJudged(row);

  node.append(el('div', 'c-trigger', cardTrigger(ev)));

  const who = el('div', 'c-who');
  who.append(document.createTextNode(row.name));
  const bits = [ev.role, ev.label].filter(Boolean);
  if (bits.length) {
    who.append(document.createTextNode(' '));
    who.append(el('span', 'dim', '· ' + bits.join(' · ')));
  }
  node.append(who);

  node.append(el('div', 'c-tie', row.summary));
  node.append(el('blockquote', 'c-quote', row.quote));

  if (row.events && row.events.length) {
    const judgedRow = el('div', 'c-judged');
    judgedRow.append(...row.events.map(eventTag));
    node.append(judgedRow);
  }

  // Same person_key showing up in another pass -- visible so a repeat isn't
  // mistaken for a fresh read, without hiding the row (each snapshot is its
  // own immutable offer and gets its own verdict).
  if (row.also_in_batches && row.also_in_batches.length) {
    const label = row.also_in_batches.length === 1
      ? `also in batch ${row.also_in_batches[0]}`
      : `also in batches ${row.also_in_batches.join(', ')}`;
    node.append(el('div', 'c-also', label));
  }

  // Public lookup's `changed` signal (L5 step 6): the newest public-web
  // change about this person, or an honest "no public update" -- never
  // fabricated, and never confused with row.summary/row.quote above, which
  // come from the reconnect producer's own evidence.
  if (row.changed) {
    const box = el('div', 'c-changed');
    box.append(document.createTextNode(row.changed.text ?? ''));
    if (row.changed.url) {
      const a = document.createElement('a');
      a.href = row.changed.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = row.changed.url;
      box.append(a);
    }
    node.append(box);
  } else {
    node.append(el('div', 'c-changed dim', 'no public update'));
  }

  const acts = el('div', 'c-acts');
  const verdicts = [
    { cls: 'fine', label: 'Fine', event: 'accepted', note: 'baseline: fine' },
    { cls: 'not-useful', label: 'Not useful', event: 'dismissed', reason: 'not-useful', note: 'baseline' },
    { cls: 'wrong-person', label: 'Wrong person', event: 'dismissed', reason: 'wrong-person', note: 'baseline' },
    { cls: 'never-this-person', label: 'Never this person', event: 'dismissed', reason: 'never-this-person', note: 'baseline' },
  ];
  for (const v of verdicts) {
    const btn = el('button', v.cls, v.label);
    // A card already carrying a verdict (from the server on load, or from an
    // optimistic click this session) keeps its buttons disabled -- one verdict
    // per snapshot, enforced in the UI as well as at hermes's write-time guard.
    if (judged) btn.disabled = true;
    btn.addEventListener('click', () => cardVerdict(row, v, node));
    acts.append(btn);
  }
  node.append(acts);

  return node;
}

function batchHead(batch) {
  const head = el('div', 'batch-head');
  head.append(el('span', null, 'batch '), el('b', null, String(batch.id)));
  head.append(el('span', null, new Date(batch.created_at).toLocaleString()));
  head.append(el('span', null, `${batch.candidate_count} candidate${batch.candidate_count === 1 ? '' : 's'}`));
  return head;
}

function renderCards() {
  const list = document.getElementById('cardsList');
  const total = cardBatches.reduce((n, b) => n + b.cards.length, 0);
  if (total === 0) {
    list.replaceChildren(el('p', 'empty', 'No candidate snapshots in any batch.'));
    return;
  }
  const nodes = [];
  for (const batch of cardBatches) {
    nodes.push(batchHead(batch));
    if (batch.cards.length === 0) { nodes.push(el('p', 'empty', 'no candidates in this batch')); continue; }
    nodes.push(...batch.cards.map(cardNode));
  }
  list.replaceChildren(...nodes);
}

async function cardVerdict(row, v, node) {
  // Optimistic: disable the four buttons the instant a verdict is clicked, so
  // a triple-click (the bug this guards against) fires at most one request --
  // the second and third clicks land on already-disabled buttons.
  for (const btn of node.querySelectorAll('.c-acts button')) btn.disabled = true;
  node.classList.add('gone');
  try {
    const res = await fetch('/api/cards/event', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        snapshot_id: row.id, person_key: row.person_key, event: v.event,
        ...(v.reason ? { reason: v.reason } : {}), note: v.note,
      }),
    });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    // duplicate:true means hermes found this snapshot already judged and
    // inserted nothing -- render the EXISTING verdict, not this click's, so
    // the badge always matches what actually landed in rm_card_event.
    if (data.duplicate && data.existing) {
      row.events = [...(row.events ?? []), data.existing];
    } else {
      row.events = [...(row.events ?? []), { event: v.event, reason: v.reason ?? null, created_at: Date.now() }];
    }
    row.judged = true;
    node.classList.remove('gone');
    node.replaceWith(cardNode(row));
  } catch (err) {
    node.classList.remove('gone');
    for (const btn of node.querySelectorAll('.c-acts button')) btn.disabled = false;
    document.getElementById('cardsList').append(el('p', 'err', 'could not save: ' + err.message));
  }
}

async function loadCards() {
  try {
    const res = await fetch('/api/cards');
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    cardBatches = data.batches ?? [];
    renderCards();
  } catch (err) {
    document.getElementById('cardsList').replaceChildren(el('p', 'err', 'could not load: ' + err.message));
  }
}

async function loadHealth() {
  const box = document.getElementById('health');
  try {
    const res = await fetch('/api/health');
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    const p = data.peopleProjection;
    if (!p) { box.textContent = ''; return; }
    box.classList.toggle('stale', Boolean(p.rebuilding));
    box.replaceChildren();
    const rev = el('span', null, 'rev '); rev.append(el('b', null, String(p.projectedRevision ?? '—')));
    const cnt = el('span', null, 'people '); cnt.append(el('b', null, String(p.peopleCount ?? '—')));
    box.append(rev, cnt);
    if (p.rebuilding) box.append(el('span', null, 'rebuilding'));
  } catch {
    box.textContent = '';
  }
}

// ---- Pages view: per-person model-built summaries --------------------
// Left: the same ranked pool the Pool tab shows (reuse /api/pool). Right:
// the selected person's page, sections in a fixed order, each item's own
// accept/reject going through /api/decide -- the exact route and payload
// shape the Claims tab already uses, so a decision made here lands in the
// same claim_decision table regardless of which tab it came from.
//
// /api/page and /api/pages/build are being built in parallel by another
// worker and may not exist on the running hermes yet; a 404 from either is
// rendered as an honest "no page yet", never as an error.
const PAGE_SECTIONS = [
  { key: 'who', label: 'who', kind: 'single' },
  { key: 'asks', label: 'asked you for', kind: 'list' },
  { key: 'objection', label: 'objection', kind: 'single' },
  { key: 'how_left', label: 'how it was left', kind: 'single' },
  { key: 'notable', label: 'notable', kind: 'list' },
];
let pagesMode = 'investor';
let pagesRows = [];
let pagesPersonKey = null;
let pagesPersonName = null;
// Public lookup's own log for whichever person is selected -- "what was
// sent", see lookupLogSection() below. Reset on every person switch so a
// slow-to-load previous person's rows can never bleed into the next.
let lookupRows = [];

// One line from /stats' sweep key (proxied verbatim by /api/health, which
// already forwards the whole /stats body -- no serve.mjs change needed for
// this part). "never run" is the whole line when there is no run yet
// (lastPassAt null); otherwise scope/swept/pending, the last pass (or its
// skip reason), tokens and the local call cap.
function relTime(ms) {
  if (ms == null) return 'never';
  const diff = Math.max(0, Date.now() - ms);
  const m = Math.floor(diff / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60);
  if (h < 24) return `${h}h ago`;
  const d = Math.floor(h / 24);
  return `${d}d ago`;
}

function sweepLine(s) {
  if (!s || s.lastPassAt == null) return 'sweep · never run';
  const powerLabel = s.powerMode === 'trickle' ? 'less power' : 'full speed';
  const passDesc = s.lastPassStatus === 'skipped'
    ? `last pass skipped: ${s.lastSkipReason ?? 'unknown'}`
    : `last pass ${relTime(s.lastPassAt)} (${powerLabel}, ${s.budget ?? '—'}/pass)`;
  const tokK = Math.round((s.tokensEst24h ?? 0) / 1000);
  return `sweep · ${s.scope ?? 0} in scope · ${s.swept ?? 0} swept · ${s.pending ?? 0} pending · `
    + `${passDesc} · ${tokK}k tok/24h · ${s.calls24h ?? 0}/${s.callCap ?? 0} calls`;
}

async function loadSweepStatus() {
  const box = document.getElementById('sweepStatus');
  if (!box) return;
  try {
    const res = await fetch('/api/health');
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    box.textContent = sweepLine(data.sweep);
  } catch {
    box.textContent = '';
  }
}

// Same /api/health body's `lookup` key (lookupStatus, relationship/lookup.mjs
// -- proxied verbatim by /api/health, same as sweep's, no serve.mjs change
// needed). "never run" is the whole line when there is no pass yet
// (lastPassAt null).
function lookupLine(l) {
  if (!l || l.lastPassAt == null) return 'lookup · never run';
  const cost30 = (l.costUsd30d ?? 0).toFixed(2);
  return `lookup · ${l.anchored ?? 0} anchored · ${l.due ?? 0} due · ${l.pending ?? 0} pending · `
    + `last pass ${relTime(l.lastPassAt)} · ${l.calls24h ?? 0}/${l.callCap ?? 0} calls · $${cost30} /30d`;
}

async function loadLookupStatus() {
  const box = document.getElementById('lookupStatus');
  if (!box) return;
  try {
    const res = await fetch('/api/health');
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    box.textContent = lookupLine(data.lookup);
  } catch {
    box.textContent = '';
  }
}

// The `cards` key (cardStats, relationship/controls.mjs) off the same
// /api/health body -- no serve.mjs change needed, same as sweep/lookup
// above. One line per producer (owe, reconnect), 56-day-window numbers:
// shown, accept rate (a raw fraction, never a verdict -- reading this as
// pass/fail is the sealed Phase 0 gates artifact's job, not this line's),
// and the never-this-person/not-useful dismissal shares.
function pct(x) { return x == null ? '—' : `${Math.round(x * 100)}%`; }
function cardKindLine(kind, k) {
  if (!k || k.shown === 0) return `${kind} · never shown`;
  return `${kind} · ${k.shown} shown (${k.daysServed}d) · accept ${pct(k.acceptRate)} · `
    + `dismissed ${k.dismissed} (never-person ${pct(k.neverThisPersonShare)}, not-useful ${pct(k.notUsefulShare)})`;
}

async function loadCardStatsLine() {
  const box = document.getElementById('cardStatsLine');
  if (!box) return;
  try {
    const res = await fetch('/api/health');
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    const c = data.cards;
    if (!c) { box.textContent = ''; return; }
    box.replaceChildren();
    for (const kind of ['owe', 'reconnect']) {
      box.append(el('div', null, `${c.windowDays}d · ${cardKindLine(kind, c.perKind[kind])}`));
    }
  } catch {
    box.textContent = '';
  }
}

function renderPagesBar() {
  const box = document.getElementById('pagesBar');
  box.replaceChildren(...MODES.map((m) => {
    const btn = el('button', null, m);
    btn.setAttribute('aria-pressed', String(m === pagesMode));
    btn.addEventListener('click', () => { pagesMode = m; renderPagesBar(); loadPagesList(); });
    return btn;
  }));
}

async function loadPagesList() {
  const list = document.getElementById('pagesList');
  list.replaceChildren(el('p', 'health', 'loading…'));
  try {
    const res = await fetchPool(pagesMode, true);
    const data = await res.json();
    pagesRows = data.rows ?? [];
    renderPagesList();
  } catch (err) {
    list.replaceChildren(el('p', 'err', 'could not load: ' + err.message));
  }
}

function renderPagesList() {
  const list = document.getElementById('pagesList');
  if (pagesRows.length === 0) {
    list.replaceChildren(el('p', 'empty', 'nobody eligible in this mode.'));
    return;
  }
  list.replaceChildren(...pagesRows.map((r) => {
    const row = el('div', 'pages-row');
    row.setAttribute('aria-current', String(r.personKey === pagesPersonKey));
    row.append(el('span', null, r.name ?? r.personKey));
    // hasPage is optional -- the pool route may not carry it yet, and this
    // view never fetches a page per row just to find out (one fetch per
    // person on every render); the marker is a convenience, not something
    // the tab depends on.
    if (r.hasPage) row.append(el('span', 'has-page', 'has page'));
    row.addEventListener('click', () => selectPagePerson(r.personKey, r.name ?? r.personKey));
    return row;
  }));
}

function selectPagePerson(personKey, name) {
  pagesPersonKey = personKey;
  pagesPersonName = name;
  lookupRows = [];
  renderPagesList();
  loadPersonPage();
  loadLookupLog();
}

async function loadPersonPage() {
  const box = document.getElementById('pagesRight');
  box.replaceChildren(el('p', 'empty', 'loading…'));
  try {
    const res = await fetch('/api/page?personKey=' + encodeURIComponent(pagesPersonKey));
    if (res.status === 404) { renderPageMissing(); return; }
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    renderPersonPage(data);
  } catch (err) {
    box.replaceChildren(el('p', 'err', 'could not load: ' + err.message));
  }
}

function pageHead(label) {
  const head = el('div', 'pages-right-head');
  head.append(el('h2', null, pagesPersonName ?? pagesPersonKey));
  const buttons = el('div', 'pages-right-head-buttons');
  const lookup = el('button', null, 'look up now');
  lookup.addEventListener('click', () => lookupNow(lookup));
  const build = el('button', null, label);
  build.addEventListener('click', () => buildPage(build));
  buttons.append(lookup, build);
  head.append(buttons);
  return head;
}

function renderPageMissing() {
  const box = document.getElementById('pagesRight');
  box.replaceChildren(pageHead('build page'), el('p', 'empty', 'no page yet'), lookupLogSection());
}

async function buildPage(btn) {
  btn.disabled = true;
  try {
    const res = await fetch('/api/pages/build', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ personKey: pagesPersonKey }),
    });
    if (!res.ok) throw new Error(await res.text());
    await loadPersonPage();
  } catch (err) {
    btn.disabled = false;
    document.getElementById('pagesRight').append(el('p', 'err', 'could not build: ' + err.message));
  }
}

function pageItemNode(item) {
  const node = el('div', 'pg-item');
  node.append(el('div', 'pg-item-text', item.text ?? ''));
  if (item.quote) node.append(el('blockquote', 'c-quote', item.quote));
  const decided = item.decision && item.decision !== 'pending';
  if (decided) {
    node.append(el('div', 'pg-decided ' + item.decision, item.decision));
  } else {
    const acts = el('div', 'pg-item-acts');
    const keep = el('button', 'keep', 'Accept');
    const drop = el('button', 'drop', 'Reject');
    keep.addEventListener('click', () => decidePageItem(item, 'accept', node));
    drop.addEventListener('click', () => decidePageItem(item, 'reject', node));
    acts.append(keep, drop);
    node.append(acts);
  }
  return node;
}

async function decidePageItem(item, action, node) {
  for (const b of node.querySelectorAll('button')) b.disabled = true;
  try {
    const res = await fetch('/api/decide', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      // Same payload shape as the Claims tab's decide(): claim_id, action,
      // reason -- one write path, one auditable trail, whichever tab a
      // decision came from.
      body: JSON.stringify({ claim_id: item.claimId, action, reason: 'reviewed in the dev review desk' }),
    });
    if (!res.ok) throw new Error(await res.text());
    item.decision = action;
    node.replaceWith(pageItemNode(item));
  } catch (err) {
    for (const b of node.querySelectorAll('button')) b.disabled = false;
    node.append(el('span', 'err', 'could not save: ' + err.message));
  }
}

function pageSectionNode(section, value) {
  const items = section.kind === 'list' ? (value ?? []) : (value ? [value] : []);
  if (items.length === 0) return null;
  const box = el('div', 'pg-section');
  box.append(el('div', 'pg-section-title', section.label));
  box.append(...items.map(pageItemNode));
  return box;
}

function renderPersonPage(data) {
  const box = document.getElementById('pagesRight');
  const nodes = [pageHead('rebuild page')];
  if (data.builtAt) nodes.push(el('p', 'pages-built', 'built ' + new Date(data.builtAt).toLocaleString()));

  const sections = data.sections ?? {};
  let any = false;
  for (const section of PAGE_SECTIONS) {
    const node = pageSectionNode(section, sections[section.key]);
    if (node) { nodes.push(node); any = true; }
  }
  if (!any) nodes.push(el('p', 'empty', 'page has no sections yet'));
  nodes.push(lookupLogSection());
  box.replaceChildren(...nodes);
}

// ---- "What was sent": public lookup's own receipt (L5 step 6) ------------
// One row per lookup_log entry for the selected person, newest first
// (/api/lookups, proxying hermes's own /admin/relationship/lookups
// verbatim -- read-only, hermes's receipt, not reconstructed here). The
// assembled query string is correct to show in full: buildLookupQuery's own
// input gate means it can only ever hold allowlisted public identifiers.
function lookupLogRow(row) {
  const node = el('div', 'lookup-row');
  const at = new Date(row.at).toLocaleString();
  const fields = (row.fieldsUsed ?? []).join(', ');
  const hash = (row.queryHash ?? '').slice(0, 12);
  const cost = row.costUsd == null ? '—' : `$${Number(row.costUsd).toFixed(4)}`;
  node.append(el('div', 'lookup-meta',
    `${at} · ${fields || '—'} · ${hash} · ${row.status} · ${row.searches ?? 0} searches · ${cost}`));
  node.append(el('div', 'lookup-query', row.query ?? ''));
  return node;
}

function lookupLogSection() {
  const box = el('div', 'pg-section');
  box.id = 'lookupLog';
  box.append(el('div', 'pg-section-title', 'what was sent'));
  if (lookupRows.length === 0) {
    box.append(el('p', 'empty', 'no lookups yet'));
  } else {
    box.append(...lookupRows.map(lookupLogRow));
  }
  return box;
}

async function loadLookupLog() {
  const personKey = pagesPersonKey;
  try {
    const res = await fetch('/api/lookups?personKey=' + encodeURIComponent(personKey));
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    // A slow response for a person the owner has since clicked away from
    // must not overwrite the rows for whoever is selected now.
    if (personKey !== pagesPersonKey) return;
    lookupRows = data.lookups ?? [];
  } catch {
    if (personKey !== pagesPersonKey) return;
    lookupRows = [];
  }
  const box = document.getElementById('lookupLog');
  if (box) box.replaceWith(lookupLogSection());
}

// "Look up now" -- POSTs hermes's own /admin/relationship/lookup/person
// through serve.mjs's proxy (writes go through hermes, like every other
// desk action). Still gated and capped hermes-side; a click here cannot
// bypass either.
async function lookupNow(btn) {
  btn.disabled = true;
  const personKey = pagesPersonKey;
  try {
    const res = await fetch('/api/lookup/person', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ personKey }),
    });
    if (!res.ok) throw new Error(await res.text());
    await loadLookupLog();
  } catch (err) {
    document.getElementById('pagesRight').append(el('p', 'err', 'could not look up: ' + err.message));
  } finally {
    btn.disabled = false;
  }
}

// ---- Lint view: step 5½'s findings, grouped by check_name ---------------
// Data: /api/lint/findings?open=1 (verbatim hermes proxy, enriched server-
// side with displayName/claimText off the desk's own read-only handle --
// see serve.mjs). Status line reuses /api/health the same way the Pages
// tab's sweep/lookup lines do (lint's own key on the same /stats body, no
// extra serve.mjs route needed). Actions: Dismiss works on any finding;
// role_conflict's own three (keep-export/keep-derived/both) only render for
// that check. On success the row is removed locally and the status line is
// refetched, rather than reloading the whole findings list.
const LINT_CHECK_LABELS = {
  expired_claim: 'expired claim',
  role_conflict: 'role conflict',
  anchored_no_page: 'anchored, no page',
  page_no_anchors: 'page, no anchors',
  orphan_card_quote: 'orphan card quote',
};
let lintFindingsData = [];

function renderLintBar() {
  const box = document.getElementById('lintBar');
  const btn = el('button', null, 'run lint now');
  btn.addEventListener('click', () => runLintNow(btn));
  box.replaceChildren(btn);
}

function lintLine(l) {
  if (!l || l.lastPassAt == null) return 'lint · never run';
  const openParts = Object.entries(l.openByCheck ?? {})
    .map(([k, v]) => `${LINT_CHECK_LABELS[k] ?? k} ${v}`).join(', ');
  const truncNote = (l.truncated ?? []).length ? ` · truncated: ${l.truncated.join(', ')}` : '';
  return `lint · ${l.open ?? 0} open (${openParts || 'none'}) · ${l.dismissed ?? 0} dismissed · `
    + `last pass ${relTime(l.lastPassAt)} (+${l.newLastPass ?? 0} new, ${l.closedLastPass ?? 0} closed)${truncNote}`;
}

async function loadLintStatus() {
  const box = document.getElementById('lintStatusLine');
  if (!box) return;
  try {
    const res = await fetch('/api/health');
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    box.textContent = lintLine(data.lint);
  } catch {
    box.textContent = '';
  }
}

function lintAge(firstSeenAt) {
  if (firstSeenAt == null) return '—';
  const d = Math.floor((Date.now() - firstSeenAt) / 86_400_000);
  return d <= 0 ? 'today' : `${d}d`;
}

async function resolveLintFindingClick(f, resolution, node) {
  for (const b of node.querySelectorAll('button')) b.disabled = true;
  try {
    const res = await fetch('/api/lint/resolve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ findingKey: f.findingKey, resolution }),
    });
    if (!res.ok) throw new Error(await res.text());
    lintFindingsData = lintFindingsData.filter((x) => x.findingKey !== f.findingKey);
    node.remove();
    if (lintFindingsData.length === 0) renderLintFindings();
    loadLintStatus();
  } catch (err) {
    for (const b of node.querySelectorAll('button')) b.disabled = false;
    node.append(el('span', 'err', 'could not save: ' + err.message));
  }
}

function lintRowNode(f) {
  const node = el('div', 'lint-row');
  node.append(el('div', 'lint-who', f.displayName ?? f.personKey ?? '(no person)'));
  node.append(el('div', 'lint-age', 'open ' + lintAge(f.firstSeenAt)));
  if (f.claimText) node.append(el('div', 'lint-detail', f.claimText));
  node.append(el('div', 'lint-detail', JSON.stringify(f.detail ?? {})));

  const acts = el('div', 'lint-acts');
  const dismiss = el('button', 'dismiss', 'Dismiss');
  dismiss.addEventListener('click', () => resolveLintFindingClick(f, 'dismiss', node));
  acts.append(dismiss);

  // role_conflict's own three resolutions -- keep-export/keep-derived/both
  // are refused by the route on every other check, so they only render here.
  if (f.checkName === 'role_conflict') {
    const exportRoles = Array.isArray(f.detail?.exportRoles) ? f.detail.exportRoles : [];
    const tag = f.detail?.tag ?? '';
    const keepExport = el('button', 'keep-export', `Keep export (${exportRoles.join('/') || '—'})`);
    keepExport.addEventListener('click', () => resolveLintFindingClick(f, 'keep-export', node));
    const keepDerived = el('button', 'keep-derived', `Keep message (${tag})`);
    keepDerived.addEventListener('click', () => resolveLintFindingClick(f, 'keep-derived', node));
    const both = el('button', 'both', 'Both');
    both.addEventListener('click', () => resolveLintFindingClick(f, 'both', node));
    acts.append(keepExport, keepDerived, both);
  }
  node.append(acts);
  return node;
}

function renderLintFindings() {
  const list = document.getElementById('lintList');
  if (lintFindingsData.length === 0) {
    list.replaceChildren(el('p', 'empty', 'no open findings.'));
    return;
  }
  const byCheck = new Map();
  for (const f of lintFindingsData) {
    if (!byCheck.has(f.checkName)) byCheck.set(f.checkName, []);
    byCheck.get(f.checkName).push(f);
  }
  const nodes = [];
  for (const [check, rows] of byCheck) {
    const head = el('div', 'lint-check-head');
    head.append(el('span', null, LINT_CHECK_LABELS[check] ?? check), el('b', null, String(rows.length)));
    nodes.push(head, ...rows.map(lintRowNode));
  }
  list.replaceChildren(...nodes);
}

async function loadLintFindings() {
  const list = document.getElementById('lintList');
  list.replaceChildren(el('p', 'health', 'loading…'));
  try {
    const res = await fetch('/api/lint/findings?open=1&limit=500');
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    lintFindingsData = data.findings ?? [];
    renderLintFindings();
  } catch (err) {
    list.replaceChildren(el('p', 'err', 'could not load: ' + err.message));
  }
}

async function runLintNow(btn) {
  btn.disabled = true;
  try {
    const res = await fetch('/api/lint', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}',
    });
    if (!res.ok) throw new Error(await res.text());
    await loadLintStatus();
    await loadLintFindings();
  } catch (err) {
    document.getElementById('lintList').append(el('p', 'err', 'could not run: ' + err.message));
  } finally {
    btn.disabled = false;
  }
}

renderTabs();
selectView('cards');

(async function load() {
  try {
    const res = await fetch('/api/pending?limit=500');
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    claims = data.claims ?? [];
    counts();
    render();
  } catch (err) {
    document.getElementById('list').replaceChildren(el('p', 'err', 'could not load: ' + err.message));
  }
}());
</script>
</body>
