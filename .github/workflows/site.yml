# Push to deploy: main -> GitHub Pages.
#
# The site is four hand-written HTML pages and a vendored font. There is no build
# step and this workflow deliberately does not invent one — it uploads `site/` as
# it stands in the repository, so what is reviewed in a diff is exactly what is
# served.
#
# WHY PAGES AND NOT FIREBASE. Firebase Hosting needed a service-account secret,
# a second console to check, and a `firebase deploy` somebody had to remember to
# run — the site went stale whenever that step was skipped, which is the failure
# mode a deploy pipeline exists to remove. Pages needs no secret at all: the job
# authenticates with the repository's own OIDC token.
name: site

on:
  push:
    branches: [main]
    # Only when the site or this workflow changes. The app and the backend share
    # this repository and change constantly; redeploying identical HTML on every
    # one of those commits is noise in the deployment history.
    paths:
      - 'site/**'
      - '.github/workflows/site.yml'
  # So a deploy can be re-run without an empty commit — after a DNS change, or to
  # re-publish if a deployment was rolled back.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  # Required by deploy-pages: it exchanges an OIDC token rather than a stored
  # credential, which is why this pipeline has no secret to leak or rotate.
  id-token: write

# Never let two deploys race. `cancel-in-progress: false` because a half-finished
# Pages deployment is worse than a slightly delayed one — let the running deploy
# land, then run the next.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # A LINK CHECK, BEFORE ANYTHING IS PUBLISHED.
      #
      # Every internal reference in the site is relative, so the pages work at a
      # project-Pages path today and at the apex later without an edit. That only
      # holds while it stays true: one root-relative href reintroduced by hand
      # 404s under the path prefix, and it 404s in production rather than here.
      # This fails the deploy instead.
      - name: check internal links
        run: |
          python3 - <<'EOF'
          import pathlib, re, sys
          site = pathlib.Path('site')
          bad = []
          for f in site.rglob('*.html'):
              s = f.read_text()
              for ref in re.findall(r'(?:href|src)="([^"]+)"', s) + re.findall(r"url\('([^']+)'\)", s):
                  if ref.startswith(('http://', 'https://', 'mailto:', 'data:', '#')):
                      continue
                  if ref.startswith('/'):
                      bad.append(f'{f}: root-relative "{ref}" breaks under a path prefix')
                      continue
                  target = (f.parent / ref.split('#')[0].split('?')[0]).resolve()
                  if target.is_dir():
                      target = target / 'index.html'
                  if not target.exists():
                      bad.append(f'{f}: "{ref}" resolves to nothing')
          for b in bad:
              print('BROKEN:', b)
          sys.exit(1 if bad else 0)
          EOF

      # The download button is an external permalink to the newest release. If it
      # ever 404s, every visitor's download is broken and nothing in the site
      # itself would show it — so the deploy checks the real URL.
      - name: check the download link resolves
        run: |
          url=$(grep -ohE 'https://github.com/[^"]*/releases/latest/download/[^"]*' site/index.html | head -1)
          echo "download link: $url"
          code=$(curl -sIL -o /dev/null -w '%{http_code}' "$url")
          echo "status: $code"
          [ "$code" = "200" ] || { echo "the download link does not resolve"; exit 1; }

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
