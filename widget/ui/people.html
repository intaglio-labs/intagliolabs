<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'">
<link rel="stylesheet" href="palette.css">
<link rel="stylesheet" href="people.css">
</head>
<body class="people">
  <div class="win">
    <!-- Clicking a tile opens that connector's own flow as a SIDE PANEL on the
         left (same as settings) — the popup grows leftward to make room. Shared
         with settings via connector-tile.js. Hidden until a tile is clicked. -->
    <div class="hint-host" id="phint"></div>
    <div class="people-main" id="pmain">
      <div class="eyebrow">people</div>
      <h1 class="p-title">unify your circles</h1>
      <p class="p-body">connectors</p>
      <!-- The connections bar: same tiles as settings, disconnected first,
           scrollable. Populated by people.js from /api/status. -->
      <div class="list" id="pconn"></div>
      <!-- Deep search: a timeframe selector, the kickoff button, and a "read
           specs" link that opens the full details as the side panel. -->
      <div class="p-param">
        <span class="p-param-label">timeframe</span>
        <select class="p-select" id="ptime">
          <option value="7">1 week</option>
          <option value="30">1 month</option>
          <option value="180">6 months</option>
          <option value="365" selected>1 year</option>
          <option value="1095">3 years</option>
          <option value="1825">5 years</option>
          <option value="0">max</option>
        </select>
      </div>
      <button class="p-init" id="pinit">initialize search</button>
      <a href="#" class="p-specs" id="pspecs">read specs ↗</a>
    </div>
    <!-- Review mode: after "initialize search", the setup column above is
         hidden and this takes its place — one "is this the same person?" card
         at a time, yes / no / skip. Built by people.js; empty until then. -->
    <div class="people-review" id="preview" hidden></div>
    <!-- The constellation is a SEPARATE popup window (people-sky.html), opened
         by the "see your constellation" button via the openSky native handler
         — it is no longer embedded in this popup. -->
    <button class="close" id="close" title="Close">×</button>
  </div>
  <script src="bridge.js"></script>
  <script src="connector-tile.js"></script>
  <script src="people.js"></script>
</body>
</html>
