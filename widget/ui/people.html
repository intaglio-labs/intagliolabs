<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'">
<link rel="stylesheet" href="palette.css">
<link rel="stylesheet" href="people.css">
</head>
<body class="people">
  <div class="win">
    <!-- The "read specs" details and (formerly) a connector's own login flow
         both use this as a SIDE PANEL / pop-over. Hidden until something
         opens it. -->
    <div class="hint-host" id="phint"></div>
    <div class="people-main" id="pmain">
      <!-- The compact header (owner, 2026-09-07): this page's actual job is
           identity review -- initSearch finds candidate duplicate-person
           pairs, and review mode asks "is this the same person?" -- named
           directly, replacing the ring of connector icons around "unify your
           circles" that said nothing about what the popup does. -->
      <div class="p-head">
        <h1 class="p-h-title">Same person?</h1>
        <p class="p-h-sub">Pairs that might be the same person across your sources. You decide; nothing merges without you.</p>
        <!-- Filled by people.js from the same /api/status data the old ring
             read: "N of M sources connected", plus how many review pairs are
             already waiting when that is cheaply known (a batch left over
             from an earlier run this session) -- never a guessed number. -->
        <div class="p-status" id="pstatus"></div>
      </div>
      <!-- Deep search: a timeframe selector, the kickoff button, and a "read
           specs" link that opens the full details as the side panel. -->
      <div class="p-controls">
        <select class="p-select" id="ptime" aria-label="timeframe">
          <option value="7">1 wk</option>
          <option value="30">1 mo</option>
          <option value="180">6 mo</option>
          <option value="365">1 yr</option>
          <option value="1095">3 yr</option>
          <option value="1825">5 yr</option>
          <option value="0" selected>max</option>
        </select>
        <button class="p-init" id="pinit">find pairs</button>
      </div>
      <p class="p-caption" id="pcaption"></p>
      <a href="#" class="p-specs" id="pspecs">read specs ↗</a>
      <!-- Opens the reconnect card directly (L5 step 10). Demoted to a small
           text link (owner, 2026-09-07): the widget bar now carries its own
           direct reconnect button, so this is a secondary door, not primary. -->
      <a href="#" class="p-reconnect" id="preconnect">reconnect</a>
    </div>
    <!-- Review mode: after "initialize search", the setup column above is
         hidden and this takes its place — one "is this the same person?" card
         at a time, yes / no / skip. Built by people.js; empty until then. -->
    <div class="people-review" id="preview" hidden></div>
    <!-- The constellation is a SEPARATE popup window (people-sky.html), opened
         by the "see your constellation" button via the openSky native handler
         — it is no longer embedded in this popup. -->
    <button class="close" id="close" title="Close">×</button>
  </div>
  <script src="bridge.js"></script>
  <script src="people.js"></script>
</body>
</html>
