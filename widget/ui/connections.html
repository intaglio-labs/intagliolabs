<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src data:">
<link rel="stylesheet" href="palette.css">
</head>
<body class="connections">
  <div class="win">
    <div class="glow"></div>
    <!-- The hint / hand-hold / bridge-login card floats over this page and is
         anchored to the connector tile that opened it. It never widens the
         native window or creates another panel beside Settings. -->
    <div class="hint-host" id="hintHost"></div>
    <div class="conn-main">
      <!-- "settings" identity and the close on ONE row, X in the top-right
           corner (owner). The settings controls come directly under it, then
           the connectors section below that. -->
      <div class="conn-head">
        <div class="eyebrow">settings</div>
        <button class="close" id="close" title="Close">×</button>
      </div>
      <div class="settings" id="settings"></div>
      <h2 class="conn-title">connectors</h2>
      <div class="list" id="grid"></div>
      <div class="notice" id="notice" hidden></div>
    </div>
  </div>
  <script src="bridge.js"></script>
  <script src="connections.js"></script>
</body>
</html>
