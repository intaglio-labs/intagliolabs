<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'">
<link rel="stylesheet" href="palette.css">
</head>
<body class="connections">
  <div class="win">
    <div class="glow"></div>
    <!-- The hint / hand-hold / bridge-login strip. It opens as a SIDE
         section, left of the main column: the native popup pins its right
         edge to the widget, so extra width grows leftward and the shelf,
         settings and footer never move when a strip opens. -->
    <div class="hint-host" id="hintHost"></div>
    <div class="conn-main">
      <!-- "settings" identity and the close on ONE row, X in the top-right
           corner (owner). The settings controls come directly under it, then
           the connectors section below that. -->
      <div class="conn-head">
        <div class="eyebrow">settings</div>
        <button class="close" id="close" title="Close">×</button>
      </div>
      <div class="settings" id="settings"></div>
      <!-- THE ANSWER TO "why does it not know anything yet".
           Reading the sources is fast; turning them into something answerable is
           not, and it used to happen invisibly — in fact not at all. This is the
           only place that says so. Hidden once there is nothing left to read,
           because a progress bar parked at 100% is furniture. -->
      <div class="setting setting-col mem" id="mem" hidden>
        <div class="setting-head">
          <span class="mem-dot" id="memDot"></span>
          <span class="setting-name" id="memLabel">reading</span>
          <span class="setting-value" id="memCount"></span>
        </div>
        <div class="mem-bar"><span id="memBar"></span></div>
        <p class="setting-note" id="memNote"></p>
      </div>
      <h2 class="conn-title">connectors</h2>
      <div class="list" id="grid"></div>
      <div class="notice" id="notice" hidden></div>
    </div>
  </div>
  <script src="bridge.js"></script>
  <script src="connections.js"></script>
</body>
</html>
