<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'; img-src data:">
<link rel="stylesheet" href="palette.css">
<link rel="stylesheet" href="people-sky.css">
<link rel="stylesheet" href="people-months.css">
</head>
<body class="plist">
  <!-- The TIMELINE: one year of your people, month by month — each month
       sorted by that month's engagement, each row carrying that MONTH's top-3
       topic chips. Data from GET /people/months via the peopleMonths handler;
       logic in people-months.js. Reuses the people-sky list styling (same
       body.plist scope) so the two popups read as siblings. -->
  <div class="plist-win">
  <div class="pl-top">
    <!-- Sync: the door into the unify-your-circles popup (people.html) — the
         People HUD button moved here, next to the surface its merges feed. -->
    <button class="pm-icon" id="sync" title="Unify your circles">
      <svg viewBox="0 0 44 44" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M34 14a14 14 0 0 0-24-2"/>
        <polyline points="10 6 10 13 17 13"/>
        <path d="M10 30a14 14 0 0 0 24 2"/>
        <polyline points="34 38 34 31 27 31"/>
      </svg>
    </button>
    <input class="pl-search" id="search" type="text" placeholder="loading your year…"
           autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="close" id="close" title="Close">×</button>
  </div>
  <!-- Year tabs, browser-style: every year with activity, oldest to newest,
       the open year lifted and connected to the list below.
       The globe is a SIBLING of the scrolling strip, not the last tab inside
       it. ~~It used to live in the strip, stuck to the right edge with
       position: sticky and an opaque background, on the reasoning that the
       years should scroll underneath it.~~ They did, and it looked broken: at
       most scroll positions a year sat half-covered (2023 measured 22px under
       the globe, showing "20"), and a year sliced mid-glyph reads as a
       rendering fault rather than as a strip that continues. Outside the
       scroller it overlaps nothing, and the strip's own fading edge is what
       says there is more to the left. -->
  <div class="pm-tabrow" id="tabrow">
    <div class="pm-tabs" id="tabs"></div>
    <!-- Not built by people-months.js like the year tabs: it is one fixed
         control, so it lives here and the script only lights it. -->
    <button class="pm-tab pm-tab-globe" id="globe" data-view="sky"
            aria-label="every year by topic">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
           stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"></circle><path d="M3 12h18"></path>
        <path d="M12 3a14 14 0 0 0 0 18a14 14 0 0 0 0-18"></path>
      </svg>
    </button>
  </div>
  <!-- The year's highlight cards, from the server's own arithmetic over the
       month timeline (ui/server/people/highlights.mjs). A card only exists
       when its sentence is true, so this row is often shorter than five and
       is empty on a thin year. Outside .pl-list so it stays put while the
       list scrolls under it. -->
  <div class="pm-cards" id="cards" hidden></div>
  <!-- Which topic the list is standing inside, after a bubble was clicked, and
       the way back out. Hidden when the list is the whole year. -->
  <div class="pm-filter" id="filter" hidden></div>
  <div class="pl-list" id="list"></div>
  <!-- The constellation: the same year seen by topic instead of by person.
       A sibling of the list rather than a second window — the year tabs above
       belong to both, and the globe is just the last tab. Hidden until it is
       the chosen view; people-months.js fills it from the year already in
       hand, so opening it costs no fetch. -->
  <div class="pm-sky" id="sky" hidden></div>
  </div>
  <script src="bridge.js"></script>
  <!-- The constellation's geometry, before the page that draws with it. -->
  <script src="people-sky-layout.js"></script>
  <script src="people-months.js"></script>
</body>
</html>
