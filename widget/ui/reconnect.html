<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'">
<link rel="stylesheet" href="palette.css">
<link rel="stylesheet" href="reconnect.css">
</head>
<!-- The reconnect card (L5 step 10): what the orb's notify state is about.
     One card at a time, its receipt in full, and the owner's verdict as four
     buttons. Every verdict is an rm_card_event joined to the immutable
     snapshot of what was offered -- the popup IS the feedback loop. All text
     lands via textContent; names never pass through markup. -->
<body class="reconnect">
  <div class="win">
    <div class="rc-head">
      <span class="rc-title" id="rcTitle">reconnect?</span>
      <button class="rc-close" id="rcClose" title="Close">✕</button>
    </div>
    <div class="rc-modes" id="rcModes" role="group" aria-label="reconnect mode">
      <button class="rc-mode" id="rcModeAny" data-mode="any">any</button>
      <button class="rc-mode" id="rcModeFounder" data-mode="founder">founder</button>
      <button class="rc-mode" id="rcModeInvestor" data-mode="investor">investor</button>
    </div>
    <div id="rcCard">
      <div class="rc-body" id="rcBody">
        <div class="rc-trigger" id="rcTrigger"></div>
        <div class="rc-name" id="rcName"></div>
        <div class="rc-who" id="rcWho"></div>
        <div class="rc-why" id="rcWhy"></div>
        <blockquote class="rc-quote" id="rcQuote"></blockquote>
        <div class="rc-asks" id="rcAsksRow" hidden>
          <div class="rc-asks-label">asked you for</div>
          <ul class="rc-asks-list" id="rcAsksList"></ul>
        </div>
        <dl class="rc-facts">
          <div id="rcRoleRow"><dt>who they are</dt><dd id="rcRole"></dd></div>
          <div id="rcLeftRow"><dt>how you left it</dt><dd id="rcLeft"></dd></div>
          <div><dt>history</dt><dd id="rcHistory"></dd></div>
        </dl>
      </div>
      <!-- Pinned footer (reconnect.css): rc-body above scrolls on its own, so
           the verdict buttons stay reachable even when a page's who/tie/quote/
           asks push the card past the panel's height. -->
      <div class="rc-footer">
        <div class="rc-drafts" id="rcDrafts">
          <button id="rcDraft">draft a text</button>
          <div class="rc-drafts-caption" id="rcDraftsCaption" hidden>drafted by your Claude · edit before sending</div>
          <ul class="rc-drafts-list" id="rcDraftsList"></ul>
          <div class="rc-drafts-error" id="rcDraftsError" hidden></div>
        </div>
        <div class="rc-actions">
          <button id="rcYes">will text them</button>
          <button id="rcNo">not relevant</button>
          <button id="rcMute">mute 30d</button>
          <button id="rcNever">never this person</button>
          <button id="rcNotThisKind">not this kind</button>
        </div>
        <div class="rc-actions-error" id="rcActionsError" hidden></div>
        <input id="rcFeedback" type="text" placeholder="why? (optional — this trains it)" autocomplete="off" spellcheck="false">
      </div>
    </div>
    <div class="rc-empty" id="rcEmpty" hidden>
      <p class="rc-empty-msg">nothing to review — the orb will light up when there is.</p>
      <button class="rc-refresh" id="rcRefresh">refresh</button>
    </div>
  </div>
  <script src="bridge.js"></script>
  <script src="reconnect.js"></script>
</body>
</html>
