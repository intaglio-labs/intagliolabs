<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'self'; script-src 'self'">
<link rel="stylesheet" href="palette.css">
<link rel="stylesheet" href="people-sky.css">
</head>
<body class="plist">
  <!-- Your people as a sortable, filterable list. One row per person with the
       fields the map computes — company, last contact, messages, channels —
       sortable by any of them and filterable by company / channel / status.
       Data from GET /people/map via the peopleMap handler; logic in
       people-sky.js. (Same file/window the constellation used, now a list.)
       The rounded card sits inside a transparent window, like the other
       popups, so its outer corners round. -->
  <div class="plist-win">
  <div class="pl-top">
    <input class="pl-search" id="search" type="text" placeholder="loading your people…"
           autocomplete="off" autocorrect="off" spellcheck="false">
    <button class="close" id="close" title="Close">×</button>
  </div>
  <div class="pl-controls">
    <label class="pl-ctl">
      <span>sort</span>
      <select id="sort">
        <option value="recent">recently talked</option>
        <option value="messages">most messages</option>
        <option value="closest">closest</option>
        <option value="dormant">longest out of touch</option>
        <option value="met">most in person</option>
        <option value="name">name A–Z</option>
      </select>
    </label>
    <label class="pl-ctl">
      <span>company</span>
      <select id="fcompany"><option value="">all</option></select>
    </label>
    <label class="pl-ctl">
      <span>channel</span>
      <select id="fchannel">
        <option value="">all</option>
        <option value="imessage">iMessage</option>
        <option value="whatsapp">WhatsApp</option>
        <option value="mail">mail</option>
        <option value="calendar">calendar</option>
        <option value="linkedin">LinkedIn</option>
      </select>
    </label>
    <label class="pl-ctl">
      <span>status</span>
      <select id="fstatus">
        <option value="">all</option>
        <option value="active">active</option>
        <option value="dormant">dormant</option>
      </select>
    </label>
  </div>
  <div class="pl-list" id="list"></div>
  <div class="pl-foot" id="foot"></div>
  </div>
  <script src="bridge.js"></script>
  <script src="people-sky.js"></script>
</body>
</html>
