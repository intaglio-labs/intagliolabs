<!doctype html><meta charset=utf-8><link rel=stylesheet href="./palette.css">
<style>
body{background:#0a0a0a;color:#8a8a8a;font:12px/1.4 ui-monospace,monospace;margin:0;padding:24px}
.row{display:grid;grid-template-columns:110px repeat(5,1fr);align-items:center;gap:8px;margin-bottom:20px}
.cell{display:flex;flex-direction:column;align-items:center;gap:10px;padding:14px 0}
.hdr{color:#5c5c5c;letter-spacing:.08em;text-transform:uppercase;font-size:10px}
.dsg{width:120px;height:120px;border-radius:50%;overflow:hidden;position:relative}
.dhl{position:absolute;inset:0;background:radial-gradient(circle at 32% 26%, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.12) 30%, transparent 55%)}
.lbl{color:#e5d6bb;font-size:11px}
.orb *{animation:none!important}.dsg{animation:none!important}
